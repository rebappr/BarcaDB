    line-height:1.5;

.insight-list{

.insight-item,

<script>

let allMatches = [];

fetch("data.json")
    .then(r => r.json())
    .then(matchesData => {

function normalizeName(name){
return String(name || "")
.toLowerCase()
.replace(/fc /g,"")
.replace(/ cf/g,"")
.replace(/./g,"")
.replace(/\s+/g," ")
.trim();
}

allMatches = matchesData;

renderHome();

})
.catch(error => console.error(error));

function renderHome(){

initPersonSearch();

renderInsights();
}

function formatInsightDate(dateString){

    const date = new Date(dateString);

    return date.toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}

async function renderInsights(){

    const insights = await fetch("insights.json")
        .then(r => r.json());

	const activeInsights = insights.filter(
	    item =>
	        String(item.Active).toUpperCase() === "TRUE"
	);
	
	const sortedInsights = activeInsights.sort(
	    (a,b) => new Date(b.Date) - new Date(a.Date)
	);
	
let html = `<div class="insight-list">`;

sortedInsights.forEach(item => {

    const isFeatured =
        String(item.Featured).toUpperCase() === "TRUE";

    if(isFeatured){

        const wrapperStart = item.Link
            ? `<a href="${item.Link}" class="featured-insight">`
            : `<div class="featured-insight">`;

        const wrapperEnd = item.Link
            ? `</a>`
            : `</div>`;

        html += `
            ${wrapperStart}

                ${
                    item.Image
                        ? `
                            <img
                                src="${item.Image}"
                                alt="${item.Title || 'Insight'}"
                                class="featured-image"
                                loading="lazy"
                                onerror="this.style.display='none';"
                            >
                        `
                        : ""
                }

                <div class="featured-body">

                    <div class="featured-tagline">
                        ${item.Tagline || ""}
                    </div>

                    <div class="featured-title">
                        ${item.Title || ""}
                    </div>

                    <div class="featured-text">
                        ${item.Text || ""}
                    </div>

                    <div class="insight-date">
                        ${formatInsightDate(item.Date)}
                    </div>

                </div>

            ${wrapperEnd}
        `;

    }else{

        const itemStart = item.Link
            ? `<a href="${item.Link}" class="insight-item">`
            : `<div class="insight-item">`;

        const itemEnd = item.Link
            ? `</a>`
            : `</div>`;

        html += `
            ${itemStart}

                <div class="insight-tagline">
                    ${item.Tagline || ""}
                </div>

                <div class="secondary-insight-title">
                    ${item.Title || ""}
                </div>

                <div class="secondary-insight-text">
                    ${item.Text || ""}
                </div>

                <div class="insight-date">
                    ${formatInsightDate(item.Date)}
                </div>

            ${itemEnd}
        `;
    }

});

html += `</div>`;

document.getElementById("insights").innerHTML = html;
}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle = document.getElementById("menuToggle");
    const menuOverlay = document.getElementById("menuOverlay");
    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});

</script>
