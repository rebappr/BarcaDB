.hero-btn.primary{

.featured-image{
    width:100%;

.featured-body{

.featured-tagline{
    color:var(--link-color);

.featured-title{
    font-size:inherit;

.featured-text{

    line-height:1.5;

.insight-list{
    column-count:2;
    column-gap:8px;
}

.insight-item,

    break-inside:avoid;
    margin-bottom:12px;
}

.insight-item{
    display:block;

    text-decoration:none;
    color:inherit;

    border:1px solid var(--meta-border);
    border-radius:12px;

    padding:12px;

    background:var(--meta-bg);
}

.featured-insight,
.insight-item{
    transition:.2s;
}

a.insight-item:hover,
a.featured-insight:hover{
    transform:translateY(-2px);
    border-color:var(--barca-blue);
}

.insight-tagline{
    color:var(--link-color);
    font-size:12px;
    font-weight:700;
    margin-bottom:4px;
}

.secondary-insight-title{
    font-weight:700;
    line-height:1.4;
}

.secondary-insight-text{
    margin-top:6px;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.insight-date{
    margin-top:6px;

    color:var(--muted);
}

.insights-container{
    width:100%;
}

.insight-item:nth-child(odd){
    background: var(--meta-bg);
}

.insight-item:nth-child(even){

}

.pagination{
    display:flex;
    justify-content:center;
    gap:8px;

    flex-wrap:wrap;
}

.pagination button{

    padding:8px 12px;

}

.pagination button:hover{

}

.pagination button.active{
    background:var(--barca-blue);

    border-color:var(--barca-blue);
}

.pagination-dots{
    display:flex;
    align-items:center;

@media(max-width:820px){

    .insight-list{

.flick-table th:not(:first-child),

width:100% !important;

top:auto;

padding:6px;

<script>

let allMatches = [];

const INSIGHTS_PER_PAGE = 20;

let currentPage = 1;
let allInsights = [];

fetch("/data/data.json")
    .then(r => r.json())
    .then(matchesData => {

function normalizeName(name){
return String(name || "")
.toLowerCase()
.replace(/fc /g,"")
.replace(/ cf/g,"")
.replace(/./g,"")
.replace(/\s+/g," ")
.trim();
}

allMatches = matchesData;

renderHome();

})
.catch(error => console.error(error));

function renderHome(){

initPersonSearch();

renderInsights();
}

function formatInsightDate(dateString){

    const date = new Date(dateString);

    return date.toLocaleDateString(
        "en-GB",
        {
            day:"numeric",
            month:"short",
            year:"numeric"
        }
    );
}

async function renderInsights(){

	if(allInsights.length === 0){
	
	    allInsights = await fetch("/data/insights.json")
	        .then(r => r.json());
	
	}
	
	const activeInsights = allInsights.filter(
	    item =>
	        String(item.Active).toUpperCase() === "TRUE"
	);
	
	const sortedInsights = activeInsights.sort(
	    (a,b) => new Date(b.Date) - new Date(a.Date)
	);

	const totalPages =
	    Math.ceil(
	        sortedInsights.length /
	        INSIGHTS_PER_PAGE
	    );
	
	const pageInsights =
	    sortedInsights.slice(
	        (currentPage - 1) * INSIGHTS_PER_PAGE,
	        currentPage * INSIGHTS_PER_PAGE
	    );
	
let html = `<div class="insight-list">`;

pageInsights.forEach(item => {

    const isFeatured =
        String(item.Featured).toUpperCase() === "TRUE";

    if(isFeatured){

        const wrapperStart = item.Link
            ? `<a href="${item.Link}" class="featured-insight">`
            : `<div class="featured-insight">`;

        const wrapperEnd = item.Link
            ? `</a>`
            : `</div>`;

        html += `
            ${wrapperStart}

                ${
                    item.Image
                        ? `
                            <img
                                src="${item.Image}"
                                alt="${item.Title || 'Insight'}"
                                class="featured-image"
                                loading="lazy"
                                onerror="this.style.display='none';"
                            >
                        `
                        : ""
                }

                <div class="featured-body">

                    <div class="featured-tagline">
                        ${item.Tagline || ""}
                    </div>

                    <div class="featured-title">
                        ${item.Title || ""}
                    </div>

                    <div class="featured-text">
                        ${item.Text || ""}
                    </div>

                    <div class="insight-date">
                        ${formatInsightDate(item.Date)}
                    </div>

                </div>

            ${wrapperEnd}
        `;

    }else{

        const itemStart = item.Link
            ? `<a href="${item.Link}" class="insight-item">`
            : `<div class="insight-item">`;

        const itemEnd = item.Link
            ? `</a>`
            : `</div>`;

        html += `
            ${itemStart}

                <div class="insight-tagline">
                    ${item.Tagline || ""}
                </div>

                <div class="secondary-insight-title">
                    ${item.Title || ""}
                </div>

                <div class="secondary-insight-text">
                    ${item.Text || ""}
                </div>

                <div class="insight-date">
                    ${formatInsightDate(item.Date)}
                </div>

            ${itemEnd}
        `;
    }

});

html += `</div>`;

document.getElementById("insights").innerHTML = html;
renderPagination(totalPages);
}

function renderPagination(totalPages){

    const container =
        document.getElementById("pagination");

    if(!container) return;

    let html = "";

    if(currentPage > 1){

        html += `
            <button onclick="
                currentPage--;
                renderInsights();
                window.scrollTo({
                    top:0,
                    behavior:'smooth'
                });
            ">
                ← Prev
            </button>
        `;
    }

    const start =
        Math.max(1, currentPage - 2);

    const end =
        Math.min(totalPages, currentPage + 2);

    if(start > 1){

        html += `
            <button onclick="
                currentPage=1;
                renderInsights();
                window.scrollTo({
                    top:0,
                    behavior:'smooth'
                });
            ">
                1
            </button>
        `;

        if(start > 2){
            html += `<span class="pagination-dots">...</span>`;
        }
    }

    for(let page=start; page<=end; page++){

        html += `
            <button
                class="${
                    page === currentPage
                    ? "active"
                    : ""
                }"
                onclick="
                    currentPage=${page};
                    renderInsights();
                    window.scrollTo({
                        top:0,
                        behavior:'smooth'
                    });
                ">
                ${page}
            </button>
        `;
    }

    if(end < totalPages){

        if(end < totalPages - 1){
            html += `<span class="pagination-dots">...</span>`;
        }

        html += `
            <button onclick="
                currentPage=${totalPages};
                renderInsights();
                window.scrollTo({
                    top:0,
                    behavior:'smooth'
                });
            ">
                ${totalPages}
            </button>
        `;
    }

    if(currentPage < totalPages){

        html += `
            <button onclick="
                currentPage++;
                renderInsights();
                window.scrollTo({
                    top:0,
                    behavior:'smooth'
                });
            ">
                Next →
            </button>
        `;
    }

    container.innerHTML = html;
}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}

attachSearch(
    "sidebarPersonSearch",
    "sidebarSearchResults"
);

}

</script>
