<style>

.content-layout.animate{
animation:pageRefresh .4s ease;
}

@keyframes pageRefresh{
from{
opacity:0;
transform:translateY(20px) scale(.98);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.left-panel{
    display:flex;
    flex-direction:column;
    flex:1.1;
    min-width:0;
    gap:8px;
}

.matches-view-switch{
display:flex;
gap:6px;
margin-bottom:10px;
}

.matches-view-switch button{
padding:8px 12px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:12px;
text-transform: uppercase;

background:var(--card-bg);
color:var(--text);

border:1px solid var(--card-border);
}

.matches-view-switch button.active{
background:#004D98;
color:white;
}

.mobile-sections{
display:none;
}

@media (prefers-color-scheme: dark){

    .filter-note{
        background:rgba(0,77,152,.15);
        border-color:#004D98;

    }

}

.matches-view-switch{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.filters{
    display:flex;
    flex-direction:column;
    gap:14px;

    padding:16px;

    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:24px;
}

.filter-section{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.filter-label{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.4px;
    color:var(--muted);
	margin-left:4px;
}

.filter-divider{
    height:1px;
    background:var(--meta-border);
    margin:2px 0;
}

.table-scroll{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.table-header{
    display:grid;

    grid-template-columns:
    36px
    1fr
    36px
    48px
    48px;

    gap:6px;
    padding:8px;

    background:var(--meta-bg);

    font-size:12px;
    font-weight:700;
    text-transform:uppercase;

    opacity:.7;
}

.table-line{
    display:grid;

    grid-template-columns:
    36px
    1fr
    36px
    48px
    48px;

    gap:6px;
    align-items:center;

    padding:8px;

    border-bottom:1px solid var(--meta-border);

    font-size:12px;
}

.table-header-full,
.table-line-full{
    display:grid;

    grid-template-columns:
    45px
    minmax(260px,1fr)
    60px
    60px
    60px
    60px
    110px
    80px
    70px;

    gap:6px;
    align-items:center;

    padding:8px;

    border-bottom:1px solid var(--meta-border);

    font-size:12px;
}

.table-header > div,
.table-line > div{
    justify-self:center;
}

.table-header > div:nth-child(1),
.table-line > div:nth-child(1){
    justify-self:start;
}

.table-header > div:nth-child(2),
.table-line > div:nth-child(2){
    justify-self:start;
}

.table-club{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    font-weight:600;
}

.table-club img{
    width:24px;
    height:24px;
    object-fit:contain;
    flex-shrink:0;
}

.table-club span{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.table-played,
.table-goaldiff,
.table-points{
    text-align:center;
}

.barca-row{
    background:rgba(0,77,152,.08);
    border-left:4px solid #FDC52C;
}

.barca-row .table-club{
    font-weight:800;
    color:#A50044;
}

.position-circle{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:11px;

    background:var(--meta-bg);
    border:1px solid var(--meta-border);
}

.position-circle.leader{
    background:#00008b;
    color:white;
    border:none;
}

.position-circle.relegation{
    background:#ef4444;
    color:white;
    border:none;
}

.table-header-full > div,
.table-line-full > div{
    justify-self:center;
}

.table-header-full > div:nth-child(1),
.table-line-full > div:nth-child(1){
    justify-self:start;
}

.table-header-full > div:nth-child(2),
.table-line-full > div:nth-child(2){
    justify-self:start;
}

.position-circle.top8{
    background:#16a34a;
    color:white;
    border:none;
}

.standings-toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
}

.view-links{
    display:flex;
    align-items:center;
    gap:12px;
    margin-left:auto;
}

.view-links a{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--muted);
    transition:.2s;
}

.view-links a:hover{
    color:#004D98;
}

.view-links a.active{
    color:#004D98;
}

@media(max-width:820px){

    .standings-toolbar{
        flex-direction:column;
        align-items:flex-start;
    }

    .view-links{
        margin-left:0;
    }

    .table-header-full,
    .table-line-full{
        grid-template-columns:
        30px
        1fr
        25px
        25px
        25px
        25px
        40px
        25px;
    }

    .table-header-full > div:nth-child(8),
    .table-line-full > div:nth-child(8){
        display:none;
    }

    .table-club img{
        width:18px;
        height:18px;
    }

    .filters{
        flex-direction:column;
    }

.left-panel{
    order:1;
	margin:0;
}

.content-layout{
display:flex;
flex-direction:column;
gap:10px;
}

.left-panel{
flex:none !important;
width:100% !important;
min-width:0;
max-width:100%;
}

.container{
padding:6px;
}

}

</style>

<script>

function getClubLogo(team){

    const displayName =
        window.getClubName
        ? window.getClubName(team)
        : team;

    return String(displayName || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        + ".png";
}

let selectedCompetition = "La Liga";

let tableView = "full";

if(window.innerWidth <= 820){
    tableView = "short";
}

function renderStandings(){

    const file =
        selectedCompetition === "UEFA Champions League"
        ? "data/tableucl.json"
        : "data/tablelaliga.json";

    fetch(file)
    .then(response => response.json())
		.then(data => {
	
	    const latestSeason =
	        [...new Set(
	            data.map(row => row.season)
	        )]
	        .sort()
	        .reverse()[0];
	
	    data = data.filter(
	        row => row.season === latestSeason
	    );
	
	    let html = "";


        if(tableView === "short"){

            html += `
                <div class="table-header">
                    <div>#</div>
                    <div>Club</div>
                    <div>P</div>
                    <div>Diff</div>
                    <div>Pts</div>
                </div>
            `;

        }else{

            html += `
                <div class="table-header-full">
                    <div>#</div>
                    <div>Club</div>
                    <div>P</div>
                    <div>W</div>
                    <div>D</div>
                    <div>L</div>
                    <div>Goals</div>
                    <div>Diff</div>
                    <div>Pts</div>
                </div>
            `;

        }

        data.forEach(row => {

            const position =
                Number(
                    row.position ||
                    row.Position
                );

            let rowClass = "";
            let posBadgeClass = "";

			if(selectedCompetition === "UEFA Champions League"){
			
			    if(position === 1){
			
			        posBadgeClass = "leader";
			
			    }else if(position <= 8){
			
			        posBadgeClass = "top8";
			
			    }
			
			}else{
			
			    if(position === 1){
			
			        posBadgeClass = "leader";
			
			    }else if(position >= 18){
			
			        posBadgeClass = "relegation";
			
			    }
			
			}
			
            if(
                row.club === "FC Barcelona" ||
                row.team === "FC Barcelona"
            ){

                rowClass = "barca-row";

            }

			const originalClub =
			    row.club || row.team;
			
			const club =
			    window.getClubName
			        ? window.getClubName(originalClub)
			        : originalClub;
			
			const matches =
			    row.matches || row.played;

            const wins =
                row.wins || 0;

            const draws =
                row.draws || 0;

            const losses =
                row.losses || 0;

            const goals =
                row.goals ||
                row.goalDifferenceText ||
                row.gfga ||
                "";

            const difference =
                row.difference ??
                row.goalDifference ??
                0;

            const points =
                row.points;

            if(tableView === "short"){

                html += `
                <div class="table-line ${rowClass}">

                    <div>
                        <div class="position-circle ${posBadgeClass}">
                            ${position}
                        </div>
                    </div>

                    <div class="table-club">

                        <img
                            src="logos/clubs/${getClubLogo(club)}"
                            alt="${club}"
                            onerror="this.src='logos/clubs/default.png'">

                        ${
                            club !== "FC Barcelona"
                            ? `
                            <a
                                href="opponent.html?name=${encodeURIComponent(club)}"
                                class="opponent-link">
                                ${club}
                            </a>
                            `
                            : club
                        }

                    </div>

                    <div class="table-played">
                        ${matches}
                    </div>

                    <div class="table-goaldiff">
                        ${Number(difference) > 0 ? "+" : ""}
                        ${difference}
                    </div>

                    <div class="table-points">
                        ${points}
                    </div>

                </div>
                `;

            }else{

                html += `
                <div class="table-line-full ${rowClass}">

                    <div>
                        <div class="position-circle ${posBadgeClass}">
                            ${position}
                        </div>
                    </div>

                    <div class="table-club">

                        <img
                            src="logos/clubs/${getClubLogo(club)}"
                            alt="${club}"
                            onerror="this.src='logos/clubs/default.png'">

                        ${
                            club !== "FC Barcelona"
                            ? `
                            <a
                                href="opponent.html?name=${encodeURIComponent(club)}"
                                class="opponent-link">
                                ${club}
                            </a>
                            `
                            : club
                        }

                    </div>

                    <div>${matches}</div>
                    <div>${wins}</div>
                    <div>${draws}</div>
                    <div>${losses}</div>
                    <div>${goals}</div>

                    <div>
                        ${Number(difference) > 0 ? "+" : ""}
                        ${difference}
                    </div>

                    <div>${points}</div>

                </div>
                `;

            }

        });

        document.getElementById(
            "standingsContainer"
        ).innerHTML =
            `<div class="table-scroll">${html}</div>`;

    })
    .catch(console.error);

}
	
function setCompetition(competition){

    selectedCompetition = competition;

    document
        .querySelectorAll("[data-competition]")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    document
        .querySelector(
            `[data-competition="${competition}"]`
        )
        ?.classList.add("active");

    renderStandings();

}

function setTableView(view){

    tableView = view;

    document
        .querySelectorAll("[data-view]")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    document
        .querySelector(
            `[data-view="${view}"]`
        )
        ?.classList.add("active");

    renderStandings();

}

let allMatches = [];

fetch("/data/data.json")
.then(r => r.json())
.then(data => {

    allMatches = data;

    initPersonSearch();

})
.catch(console.error);

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Team"]){

            searchItems.set(
                `opponent-${match["Opp. Team"]}`,
                {
                    name: match["Opp. Team"],
                    type: "Opponent"
                }
            );

        }

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        for(let i = 1; i <= 12; i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    const input =
        document.getElementById(
            "sidebarPersonSearch"
        );

    const results =
        document.getElementById(
            "sidebarSearchResults"
        );

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name
                    .toLowerCase()
                    .includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">

                ${filtered.map(item => {

                    let url = "player.html?name=" +
                        encodeURIComponent(item.name);

                    if(item.type === "Manager"){

                        url =
                        "manager.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    if(item.type === "Opponent"){

                        url =
                        "opponent.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    return `

                        <a
                            class="player-search-item"
                            href="${url}">

                            ${item.name}

                            <span class="search-type ${item.type.toLowerCase()}">
                                (${item.type})
                            </span>

                        </a>

                    `;

                }).join("")}

            </div>
        `;

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        }, 200);

    });

}

document.addEventListener("DOMContentLoaded", () => {

    document
        .querySelector(
            `[data-competition="${selectedCompetition}"]`
        )
        ?.classList.add("active");

    document
        .querySelector(
            `[data-view="${tableView}"]`
        )
        ?.classList.add("active");

    renderStandings();

});

</script>
