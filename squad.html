<script>

function getCountryLogo(country){

    const code =
        window.getCountryCode
        ? window.getCountryCode(country)
        : "default";

    return `logos/countries/${code}.png`;
}

let currentPosition = "all";
let currentSearch = "";
let currentSeason = "";

function getPositionGroup(position){

    const defenders = [
        "Centre Back",
        "Left Back",
        "Right Back"
    ];

    const midfielders = [
        "Defensive Midfield",
        "Central Midfield",
        "Attacking Midfield"
    ];

    const forwards = [
        "Centre Forward",
        "Left Wing",
        "Right Wing",
        "Second Striker"
    ];

    if(position === "Goalkeeper") return "Goalkeeper";
    if(defenders.includes(position)) return "Defender";
    if(midfielders.includes(position)) return "Midfielder";
    if(forwards.includes(position)) return "Forward";

    return position;
}

function buildPlayerStats(matches){

    playerStats = {};

    currentSeason =
        matches[0]?.Season ||
        matches[0]?.["Season"];

    const seasonMatches =
        matches.filter(match =>
            (match.Season || match["Season"]) ===
            currentSeason
        );

    seasonMatches.forEach(match => {

        if(!match["Player name 1"]) return;

        const conceded =
            Number(match.Conceded || 0);

			for(let i = 1; i <= 11; i++){
			
			    const player =
			        match[`Player name ${i}`];
			
			    if(!player) continue;
			
			    if(!playerStats[player]){
			
			        playerStats[player] = {
			            apps:0,
			            goals:0,
			            assists:0,
			            conceded:0,
			            cleanSheets:0
			        };
			
			    }
			
			    playerStats[player].apps++;
			
			    if(i === 1){
			
			        playerStats[player].conceded +=
			            conceded;
			
			        if(conceded === 0){
			            playerStats[player].cleanSheets++;
			        }
			
			    }
			
			}
			
			for(let i = 1; i <= 6; i++){
			
			    const player =
			        match[`Sub on ${i}`];
			
			    if(!player) continue;
			
			    if(!playerStats[player]){
			
			        playerStats[player] = {
			            apps:0,
			            goals:0,
			            assists:0,
			            conceded:0,
			            cleanSheets:0
			        };
			
			    }
			
			    playerStats[player].apps++;
			
			}

        // Góly
        for(let i = 1; i <= 12; i++){

            const scorer =
                match[`Goal Player ${i}`];

            if(
                scorer &&
                !scorer.includes("(OG)")
            ){

                if(!playerStats[scorer]){

                    playerStats[scorer] = {
                        apps:0,
                        goals:0,
                        assists:0,
                        conceded:0,
                        cleanSheets:0
                    };

                }

                playerStats[scorer].goals++;

            }

        }

        // Asistencie
        for(let i = 1; i <= 12; i++){

            const assist =
                match[`Assist Player ${i}`];

            if(assist){

                if(!playerStats[assist]){

                    playerStats[assist] = {
                        apps:0,
                        goals:0,
                        assists:0,
                        conceded:0,
                        cleanSheets:0
                    };

                }

                playerStats[assist].assists++;

            }

        }

    });

}

function renderSquad(players){

const positionOrder = {
    "Goalkeeper": 1,

    "Left Back": 2,
    "Centre Back": 2,
    "Right Back": 2,

    "Defensive Midfield": 3,
    "Central Midfield": 3,
    "Attacking Midfield": 3,

    "Left Wing": 4,
    "Right Wing": 4,
    "Centre Forward": 4,
    "Second Striker": 4
};

	const filtered = players
	    .filter(player => {
	
	        const stats =
	            playerStats[player.Name] || {
	                apps: 0
	            };
	
	        const searchMatch =
	            (player.Name || "")
	            .toLowerCase()
	            .includes(currentSearch.toLowerCase());
	
	        const positionMatch =
	            currentPosition === "all" ||
	            getPositionGroup(player.Position) === currentPosition;
	
	        const playedMatch =
	            stats.apps > 0;
	
	        return searchMatch &&
	               positionMatch &&
	               playedMatch;
	    })
	    .sort((a, b) => {
	
	        const posA =
	            positionOrder[a.Position] || 99;
	
	        const posB =
	            positionOrder[b.Position] || 99;
	
	        if(posA !== posB){
	            return posA - posB;
	        }
	
	        return Number(a.Number || 999) -
	               Number(b.Number || 999);
	    });

    document.getElementById("visiblePlayers").textContent =
        filtered.length;

	const groups = {
	    Goalkeepers: [],
	    Defenders: [],
	    Midfielders: [],
	    Forwards: []
	};
	
	filtered.forEach(player => {
	
	    const group = getPositionGroup(player.Position);
	
	    if(group === "Goalkeeper"){
	        groups.Goalkeepers.push(player);
	    }
	    else if(group === "Defender"){
	        groups.Defenders.push(player);
	    }
	    else if(group === "Midfielder"){
	        groups.Midfielders.push(player);
	    }
	    else{
	        groups.Forwards.push(player);
	    }
	
	});

	document.getElementById("squadGrid").innerHTML =
	
	Object.entries(groups)
	.filter(([_, players]) => players.length)
	.map(([title, players]) => `
	
	    <div class="squad-group">
	
	        <div class="squad-group-title">
	            ${title}
	        </div>
	
	        <div class="squad-group-grid">
	
	            ${players.map(player => {
	
					const playerPhoto =
					    player.Photo &&
					    player.Photo.trim() !== "";
	
					const initials = player.Name
					    .split(" ")
					    .slice(0, 2)
					    .map(part => part.charAt(0))
					    .join("")
					    .toUpperCase();

					const stats =
					    playerStats[player.Name] || {
					        apps:0,
					        goals:0,
					        assists:0,
					        conceded:0,
					        cleanSheets:0
					    };
					
					const isGoalkeeper =
					    player.Position === "Goalkeeper";
	
	                return `
	
	                    <a
	                        href="player.html?name=${encodeURIComponent(player.Name)}"
	                        class="player-card-link">
	
	                        <article class="player-card">

							    <div class="player-number">
							        #${player.Number || "-"}
							    </div>

								<div class="player-flag">
									<img
									    src="${getCountryLogo(player.Nationality)}"
									    alt="${player.Nationality}"
									    onerror="this.src='logos/countries/default.png'">
								</div>
	
	                            <div class="player-top">
	
	                                ${
	                                playerPhoto
	                                ? `
									<img
									    src="logos/players/${player.Photo || 'default.webp'}"
									    alt="${player.Name}"
									    class="player-photo"
									    loading="lazy"
									    onerror="this.src='logos/players/default.webp'">
	                                `
	                                : `
	                                <div class="player-initials">
	                                    ${initials}
	                                </div>
	                                `
	                                }
	
	                                <div class="player-info">
	
										<div class="player-name">
										    ${player.Name}
										</div>

										<div class="player-position">
										    ${player.Position}
										</div>
	
										<div class="player-stats">
										
										    <div class="player-stat">
										
										        <div class="player-stat-value">
										            ${stats.apps}
										        </div>
										
										        <div class="player-stat-label">
										            Apps
										        </div>
										
										    </div>
										
										    <div class="player-stat">
										
										        <div class="player-stat-value">
										            ${
										                isGoalkeeper
										                ? stats.conceded
										                : stats.goals
										            }
										        </div>
										
										        <div class="player-stat-label">
										            ${
										                isGoalkeeper
										                ? "Conceded"
										                : "Goals"
										            }
										        </div>
										
										    </div>
										
										    <div class="player-stat">
										
										        <div class="player-stat-value">
										            ${
										                isGoalkeeper
										                ? stats.cleanSheets
										                : stats.assists
										            }
										        </div>
										
										        <div class="player-stat-label">
										            ${
										                isGoalkeeper
										                ? "Clean Sheets"
										                : "Assists"
										            }
										        </div>
										
										    </div>
										
										</div>
	
	                                </div>
	
	                            </div>
	
	                        </article>
	
	                    </a>
	
	                `;
	
	            }).join("")}
	
	        </div>
	
	    </div>
	
	`).join("");
}

document.addEventListener("DOMContentLoaded", () => {

    if(typeof initPersonSearch === "function"){
        initPersonSearch();
    }

});

function initPersonSearch(){

    if(typeof allMatches === "undefined"){
        return;
    }

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Team"]){

            searchItems.set(
                `opponent-${match["Opp. Team"]}`,
                {
                    name: match["Opp. Team"],
                    type: "Opponent"
                }
            );

        }

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        for(let i = 1; i <= 12; i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    const input =
        document.getElementById(
            "sidebarPersonSearch"
        );

    const results =
        document.getElementById(
            "sidebarSearchResults"
        );

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name
                    .toLowerCase()
                    .includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">

                ${filtered.map(item => {

                    let url = "player.html?name=" +
                        encodeURIComponent(item.name);

                    if(item.type === "Manager"){

                        url =
                        "manager.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    if(item.type === "Opponent"){

                        url =
                        "opponent.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    return `

                        <a
                            class="player-search-item"
                            href="${url}">

                            ${item.name}

                            <span class="search-type ${item.type.toLowerCase()}">
                                (${item.type})
                            </span>

                        </a>

                    `;

                }).join("")}

            </div>
        `;

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        }, 200);

    });

}

</script>
