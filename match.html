<script>

console.log("SCRIPT STARTED");

const params = new URLSearchParams(location.search);
const matchId = params.get("id");

console.log("ID:", matchId);

if (!matchId) {
    document.getElementById("app").innerHTML =
        "<div class='card'>Missing ID in URL</div>";
    throw new Error("Missing id parameter");
}

let allMatches = [];

fetch("./data.json")
.then(r => {

if (!r.ok) {
throw new Error(`HTTP ${r.status}`);
}

return r.json();
})
.then(data => {

    allMatches = data;

    initPersonSearch();

    console.log("DATA LOADED");
    console.log(data);

    if (!Array.isArray(data)) {
        throw new Error("data.json is not an array");
    }

console.log("Looking for ID:", matchId);

const match =
data.find(
row =>
String(row.ID).trim() ===
String(matchId).trim()
);

if (!match) {

document.getElementById("app").innerHTML =
"<div class='card'>Match not found</div>";

return;
}

renderMatch(match, data);

})

.catch(error => {

console.error(error);

document.getElementById("app").innerHTML = `
       <div class="card">
           Error:<br>
           ${error.message}
       </div>
   `;

});

function showMatchSection(section){

if(window.innerWidth > 820){
return;
}

const current =
document.querySelector(".match-section.active");

const next =
document.getElementById(section);

const isLineups =
section === "squads-section";

current?.classList.remove("active");

next.classList.remove("slide-left","slide-right");
next.classList.add(
isLineups ? "slide-right" : "slide-left"
);

next.classList.add("active");

document
.querySelectorAll(".match-tab")
.forEach(el => el.classList.remove("active"));

document
.querySelector(`[data-section="${section}"]`)
.classList.add("active");
}

window.showMatchSection = showMatchSection;

function escapeHtml(str){

    if(str === null || str === undefined){
        return "";
    }

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}

function getPlayerIcons(match, playerName, prefix="") {

    const events = [];

    // Góly
    for(let i=1; i<=12; i++){
        if(
            String(match[`${prefix}Goal Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Goal min ${i}`],
                icon: "⚽"
            });
        }
    }

    // Asistencie
    for(let i=1; i<=12; i++){
        if(
            String(match[`${prefix}Assist Player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Goal min ${i}`],
                icon: "🅰️"
            });
        }
    }

    // Žlté karty
    for(let i=1; i<=12; i++){
        if(
            String(match[`${prefix}Yellow player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Yellow min ${i}`],
                icon: "🟨"
            });
        }
    }

    // Červené karty
    for(let i=1; i<=5; i++){
        if(
            String(match[`${prefix}Red player ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Red min ${i}`],
                icon: "🟥"
            });
        }
    }

    // Striedanie IN
    for(let i=1; i<=6; i++){
        if(
            String(match[`${prefix}Sub on ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Sub min ${i}`],
                icon: '<span style="color:#16a34a;font-weight:700;">⬆</span>'
            });
        }
    }

    // Striedanie OUT
    for(let i=1; i<=6; i++){
        if(
            String(match[`${prefix}Sub off ${i}`] || "").trim() ===
            String(playerName).trim()
        ){
            events.push({
                minute: match[`${prefix}Sub min ${i}`],
                icon: '<span style="color:#dc2626;font-weight:700;">⬇</span>'
            });
        }
    }

    events.sort((a,b) => {

        const ma =
            parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

        const mb =
            parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

        return ma - mb;
    });

    return events.map(e => e.icon).join(" ");
}

function getPlayers(match,prefix=""){

const captain = match[`${prefix}Captain`] || "";

const events = [];

let awayScore = 0;

function sortByMinute(arr){

arr.sort((a,b) => {

const aCheck = String(a.minute).trim() === "✔";
const bCheck = String(b.minute).trim() === "✔";

if (aCheck && !bCheck) return 1;
if (!aCheck && bCheck) return -1;
if (aCheck && bCheck) return 0;

const ma =
parseInt(String(a.minute).match(/\d+/)?.[0] || 0);

const mb =
parseInt(String(b.minute).match(/\d+/)?.[0] || 0);

return ma - mb;

});

}

// GOALS

for(let i=1;i<=12;i++){

if(match[`Goal Player ${i}`]){

events.push({
minute: match[`Goal min ${i}`],
side: homeMatch ? "left":"right",
player: match[`Goal Player ${i}`],
assist: match[`Assist Player ${i}`] || "",
penalty:
match[`Penalty player ${i}`] &&
String(match[`Penalty scored ${i}`] || "")
.trim()
.toLowerCase() !== "not in"
});

}

if(match[`Opp. Goal Player ${i}`]){

events.push({
minute: match[`Opp. Goal min ${i}`],
side: homeMatch ? "right":"left",
player: match[`Opp. Goal Player ${i}`],
assist: match[`Opp. Assist player ${i}`] || "",
penalty:
match[`Opp. Penalty player ${i}`] &&
String(match[`Opp. Penalty scored ${i}`] || "")
.trim()
.toLowerCase() !== "not in"
});

}

}

// MISSED PENALTIES

for(let i=1;i<=12;i++){

String(match[`Penalty scored ${i}`] || "")
.trim()
.toLowerCase() === "not in"
){

side: homeMatch ? "left":"right",

});

}

if(
match[`Opp. Penalty player ${i}`] &&
String(match[`Opp. Penalty scored ${i}`] || "")
.trim()
.toLowerCase() === "not in"
){

side: homeMatch ? "right":"left",

});

});

}

sortByMinute(events);

});

if(halftimeIndex !== -1){

    });

let currentHome = 0;

function getH2H(match, allMatches){

const opponent =
String(match["Opp. Team"] || "").trim();

const currentMatchDate =
new Date(
match.Date.split(".").reverse().join("-")
);

const allH2H = allMatches
.filter(row => {

const sameOpponent =
String(row["Opp. Team"] || "").trim() === opponent;

const playedMatch =
String(row.Result || "").trim() !== "-:-";

const matchDate =
new Date(
row.Date.split(".").reverse().join("-")
);

const olderMatch =
matchDate < currentMatchDate;

return (
sameOpponent &&
playedMatch &&
olderMatch
);

});

const wins =
allH2H.filter(
row => row["Result type"] === "W"
).length;

const draws =
allH2H.filter(
row => row["Result type"] === "D"
).length;

const losses =
allH2H.filter(
row => row["Result type"] === "L"
).length;

const h2hMatches = [...allH2H]
.sort((a,b) =>
new Date(b.Date.split(".").reverse().join("-")) -
new Date(a.Date.split(".").reverse().join("-"))
)
.slice(0,10);

});

html += `

   `;

return html;
}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

function showMobileSection(section, button){

if(window.innerWidth > 820) return;

document.querySelectorAll(
'.mobile-section-btn'
).forEach(btn =>
btn.classList.remove('active')
);

button.classList.add('active');

document.getElementById(
'mobileMatchesSection'
).style.display = 'none';

document.getElementById(
'laligaWidget'
).style.display = 'none';

document.getElementById(
'mobileDebutantsSection'
).style.display = 'none';

document.getElementById(
'mobileStatisticsSection'
).style.display = 'none';

if(section === 'matches'){
document.getElementById(
'mobileMatchesSection'
).style.display = 'block';
}

if(section === 'table'){

    document.getElementById(
        'laligaWidget'
    ).style.display = 'block';

    renderLaLigaTable();
}

if(section === 'debutants'){
document.getElementById(
'mobileDebutantsSection'
).style.display = 'block';
}

if(section === 'statistics'){
document.getElementById(
'mobileStatisticsSection'
).style.display = 'block';
}

}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle = document.getElementById("menuToggle");
    const menuOverlay = document.getElementById("menuOverlay");
    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});

document.addEventListener("DOMContentLoaded", () => {

    if(window.innerWidth <= 820){

        document.getElementById("laligaWidget").style.display = "none";
        document.getElementById("mobileDebutantsSection").style.display = "none";
        document.getElementById("mobileStatisticsSection").style.display = "none";

        document.getElementById("mobileMatchesSection").style.display = "block";
    }

});

</script>
