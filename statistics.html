<script>

let allMatches = [];

let flickSortColumn = "total";
let flickSortDirection = "desc";
let managerTableSortColumn = "winPct";
let managerTableSortDirection = "desc";

Promise.all([
fetch("data.json").then(r => r.json()),
fetch("current-season.json").then(r => r.json())
])
.then(([matchesData,currentData]) => {

function normalizeName(name){
return String(name || "")
.toLowerCase()
.replace(/fc /g,"")
.replace(/ cf/g,"")
.replace(/./g,"")
.replace(/\s+/g," ")
.trim();
}

currentData.forEach(currentMatch => {

const match = matchesData.find(m =>

m.Date === currentMatch.Date &&
m.Competition === currentMatch.Competition &&
m["Home/Away"] === currentMatch["Home/Away"] &&
normalizeName(m["Opp. Team"]) ===
normalizeName(currentMatch["Opp. Team"])

);

if(match){

match.Result = currentMatch.Result;

if(
match.Result &&
match.Result !== "-:-" &&
match.Result.includes(":")
){

const [homeGoals,awayGoals] =
match.Result.split(":").map(Number);

if(match["Home/Away"] === "Home"){

match["Result type"] =
homeGoals > awayGoals ? "W" :
homeGoals < awayGoals ? "L" : "D";

}else{

match["Result type"] =
awayGoals > homeGoals ? "W" :
awayGoals < homeGoals ? "L" : "D";

}

}

}

});

allMatches = matchesData;

renderHome();

})
.catch(error => console.error(error));

function renderHome(){

renderLastMatch();
renderNextMatch();
renderTopFlickPlayers();
renderTopManagers();

initPersonSearch();

renderTopScorers();
renderTopAssists();
renderRecentForm();

renderMilestones();
}

function parseDate(date) {

    const [day, month, year] = date.split(".");

    return new Date(
        Number(year),
        Number(month) - 1,
        Number(day)
    );
}

function renderLastMatch(){

const today = new Date();

today.setHours(0,0,0,0);

const played = allMatches
.filter(m =>
parseDate(m.Date) < today
)
.sort((a,b) =>
parseDate(b.Date) - parseDate(a.Date)
);

const match = played[0];

if(!match) return;

const homeTeam =
    match["Home/Away"] === "Home"
        ? "FC Barcelona"
        : `<a class="opponent-link fixture-opponent"
              href="opponent.html?name=${encodeURIComponent(match["Opp. Team"])}">
              ${match["Opp. Team"]}
           </a>`;

const awayTeam =
    match["Home/Away"] === "Home"
        ? `<a class="opponent-link fixture-opponent"
              href="opponent.html?name=${encodeURIComponent(match["Opp. Team"])}">
              ${match["Opp. Team"]}
           </a>`
        : "FC Barcelona";

document.getElementById("lastMatch").innerHTML = `
<div class="fixture-link">

    <div class="fixture-title">
        LAST MATCH
    </div>

    <div class="fixture-card">

        <div class="fixture-team">
            ${homeTeam}
        </div>

        <div class="fixture-center">
            <a
			href="match.html?id=${match.ID}"
			class="fixture-score"
			style="display:inline-block;text-decoration:none;color:white;"
			>
			${match.Result}
			</a>
        </div>

        <div class="fixture-team">
            ${awayTeam}
        </div>

    </div>

    <div class="fixture-meta">
        ${match.Date} • ${match.Competition}
    </div>

</div>
`;
}

function renderNextMatch(){

const today = new Date();

today.setHours(0,0,0,0);

const next = allMatches
.filter(m =>
parseDate(m.Date) >= today
)
.sort((a,b) =>
parseDate(a.Date) - parseDate(b.Date)
)[0];

if(!next){

document.getElementById("nextMatch").innerHTML =
"No upcoming matches";

return;
}

const homeTeam =
    next["Home/Away"] === "Home"
        ? "FC Barcelona"
        : `<a class="opponent-link fixture-opponent"
              href="opponent.html?name=${encodeURIComponent(next["Opp. Team"])}">
              ${next["Opp. Team"]}
           </a>`;

const awayTeam =
    next["Home/Away"] === "Home"
        ? `<a class="opponent-link fixture-opponent"
              href="opponent.html?name=${encodeURIComponent(next["Opp. Team"])}">
              ${next["Opp. Team"]}
           </a>`
        : "FC Barcelona";

document.getElementById("nextMatch").innerHTML = `
<div class="fixture-link">

    <div class="fixture-title">
        UPCOMING MATCH
    </div>

    <div class="fixture-card">

        <div class="fixture-team">
            ${homeTeam}
        </div>

		<div class="fixture-center">
		    <a
		        href="match.html?id=${next.ID}"
		        class="fixture-vs"
		        style="display:inline-block;text-decoration:none;color:inherit;"
		    >
		        VS
		    </a>
		</div>

        <div class="fixture-team">
            ${awayTeam}
        </div>

    </div>

    <div class="fixture-meta">
        ${next.Date} • ${next.Competition}
    </div>

</div>
`;
}

function sortFlick(column){

    if(flickSortColumn === column){

        flickSortDirection =
            flickSortDirection === "asc"
            ? "desc"
            : "asc";

    }else{

        flickSortColumn = column;
        flickSortDirection = "desc";

    }

    renderTopFlickPlayers();

}

window.sortFlick = sortFlick;

function sortManagers(column){

    if(managerTableSortColumn === column){

        managerTableSortDirection =
            managerTableSortDirection === "asc"
            ? "desc"
            : "asc";

    }else{

        managerTableSortColumn = column;
        managerTableSortDirection = "desc";

    }

    renderTopManagers();
}

window.sortManagers = sortManagers;

function renderTopFlickPlayers(){

    const stats = {};

    // iba zápasy pod Flickom
    const flickMatches = allMatches.filter(
        m => m.Manager === "Hansi Flick"
    );

    function addPlayer(name){

        if(!name) return;

        name = String(name).trim();

        if(name.includes("(OG)")) return;

        if(!stats[name]){

            stats[name] = {
                appearances:0,
                goals:0,
                assists:0
            };

        }
    }

    flickMatches.forEach(match => {

// základná zostava = odohraný zápas
for(let i=1;i<=11;i++){

    const player = match[`Player name ${i}`];

    if(player){

        addPlayer(player);
        stats[player].appearances++;

    }

}

// striedania IN = odohraný zápas
for(let i=1;i<=12;i++){

    const player = match[`Substitution IN Player ${i}`];

    if(player){

        addPlayer(player);
        stats[player].appearances++;

    }

}

        // goals
        for(let i=1;i<=12;i++){

            const player =
            match[`Goal Player ${i}`];

            if(player && !player.includes("(OG)")){

                addPlayer(player);
                stats[player].goals++;

            }

        }

        // assists
        for(let i=1;i<=12;i++){

            const player =
            match[`Assist Player ${i}`];

            if(player){

                addPlayer(player);
                stats[player].assists++;

            }

        }

    });

    const top = Object.entries(stats)
.map(([name,s]) => ({
    name,
    appearances:s.appearances,
    goals:s.goals,
    assists:s.assists,
    total:s.goals + s.assists
}))
    .sort((a,b) => {
    
        const valueA = a[flickSortColumn];
        const valueB = b[flickSortColumn];
    
        return flickSortDirection === "asc"
            ? valueA - valueB
            : valueB - valueA;
    
    })
    .slice(0,10);

    let html = `
    <table class="flick-table">
        <thead>
            <tr>
                <th>Player</th>
                
                <th
                    class="${flickSortColumn==='appearances'?'flick-selected':''}"
                    onclick="sortFlick('appearances')">
                    M
                </th>
                
                <th
                    class="${flickSortColumn==='goals'?'flick-selected':''}"
                    onclick="sortFlick('goals')">
                    G
                </th>
                
                <th
                    class="${flickSortColumn==='assists'?'flick-selected':''}"
                    onclick="sortFlick('assists')">
                    A
                </th>
                
                <th
                    class="${flickSortColumn==='total'?'flick-selected':''}"
                    onclick="sortFlick('total')">
                    G+A
                </th>
            </tr>
        </thead>
        <tbody>
    `;

    top.forEach(player => {

        html += `
        <tr>

            <td>
                <a class="player-link"
                    href="player.html?name=${encodeURIComponent(player.name)}">
                    ${player.name}</a>
            </td>
            <td class="${flickSortColumn==='appearances'?'flick-column-selected':''}">${player.appearances}</td>
            <td class="${flickSortColumn==='goals'?'flick-column-selected':''}">${player.goals}</td>
            <td class="${flickSortColumn==='assists'?'flick-column-selected':''}">${player.assists}</td>
            <td class="${flickSortColumn==='total'?'flick-column-selected':''}">${player.total}</td>

        </tr>
        `;

    });

    html += `
        </tbody>
    </table>
    `;

    document.getElementById(
        "topFlickPlayers"
    ).innerHTML = html;

}

function renderTopManagers(){

    const stats = {};

    allMatches.forEach(match => {

        const manager = match.Manager;

        if(!manager) return;

        if(!stats[manager]){

            stats[manager] = {
                matches:0,
                wins:0,
                draws:0,
                losses:0,
                gf:0,
                ga:0
            };

        }

        stats[manager].matches++;

		if(match["Home/Away"] === "Home"){
		
		    stats[manager].gf +=
		        Number(match["Goals home team"]) || 0;
		
		    stats[manager].ga +=
		        Number(match["Goals away team"]) || 0;
		
		}else{
		
		    stats[manager].gf +=
		        Number(match["Goals away team"]) || 0;
		
		    stats[manager].ga +=
		        Number(match["Goals home team"]) || 0;
		
		}

        if(match["Result type"] === "W"){
            stats[manager].wins++;
        }

        if(match["Result type"] === "D"){
            stats[manager].draws++;
        }

        if(match["Result type"] === "L"){
            stats[manager].losses++;
        }

    });

    const managers = Object.entries(stats)

    .map(([name,s]) => ({

        name,

        matches:s.matches,
        wins:s.wins,
        draws:s.draws,
        losses:s.losses,
        gf:s.gf,
        ga:s.ga,

        winPct:
            Number(
                ((s.wins / s.matches) * 100)
                .toFixed(1)
            )

    }))

    .filter(m => m.matches >= 100)

    .sort((a,b) => {

        const valueA = a[managerTableSortColumn];
        const valueB = b[managerTableSortColumn];

        return managerTableSortDirection === "asc"
            ? valueA - valueB
            : valueB - valueA;

    });

    let html = `
    <table class="flick-table">
        <thead>
            <tr>

                <th>Manager</th>

                <th class="${managerTableSortColumn==='matches' ? 'flick-selected' : ''}"
                    onclick="sortManagers('matches')">M</th>

                <th class="${managerTableSortColumn==='wins' ? 'flick-selected' : ''}"
                    onclick="sortManagers('wins')">W</th>

                <th class="${managerTableSortColumn==='draws' ? 'flick-selected' : ''}"
                    onclick="sortManagers('draws')">D</th>

                <th class="${managerTableSortColumn==='losses' ? 'flick-selected' : ''}"
                    onclick="sortManagers('losses')">L</th>

                <th class="${managerTableSortColumn==='gf' ? 'flick-selected' : ''}"
                    onclick="sortManagers('gf')">GF</th>

                <th class="${managerTableSortColumn==='ga' ? 'flick-selected' : ''}"
                    onclick="sortManagers('ga')">GA</th>

                <th class="${managerTableSortColumn==='winPct' ? 'flick-selected' : ''}"
                    onclick="sortManagers('winPct')">W%</th>

            </tr>
        </thead>

        <tbody>
    `;

    managers.forEach(manager => {

        html += `
        <tr>

			<td>
			    <a
			        class="player-link"
			        href="manager.html?name=${encodeURIComponent(manager.name)}">
			        ${manager.name}
			    </a>
			</td>

			<td class="${managerTableSortColumn==='matches' ? 'flick-column-selected' : ''}">
			    ${manager.matches}
			</td>
			
			<td class="${managerTableSortColumn==='wins' ? 'flick-column-selected' : ''}">
			    ${manager.wins}
			</td>
			
			<td class="${managerTableSortColumn==='draws' ? 'flick-column-selected' : ''}">
			    ${manager.draws}
			</td>
			
			<td class="${managerTableSortColumn==='losses' ? 'flick-column-selected' : ''}">
			    ${manager.losses}
			</td>
			
			<td class="${managerTableSortColumn==='gf' ? 'flick-column-selected' : ''}">
			    ${manager.gf}
			</td>
			
			<td class="${managerTableSortColumn==='ga' ? 'flick-column-selected' : ''}">
			    ${manager.ga}
			</td>
			
			<td class="${managerTableSortColumn==='winPct' ? 'flick-column-selected' : ''}">
			    ${manager.winPct}%
			</td>

        </tr>
        `;

    });

    html += `
        </tbody>
    </table>
    `;

    document.getElementById("topManagers").innerHTML = html;

}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle = document.getElementById("menuToggle");
    const menuOverlay = document.getElementById("menuOverlay");
    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});

document.addEventListener("DOMContentLoaded", () => {

    if(window.innerWidth <= 820){

        document.getElementById("laligaWidget").style.display = "none";
        document.getElementById("mobileDebutantsSection").style.display = "none";
        document.getElementById("mobileStatisticsSection").style.display = "none";

        document.getElementById("mobileMatchesSection").style.display = "block";
    }

});
