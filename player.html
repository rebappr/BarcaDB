<script>

const params =
new URLSearchParams(location.search);

const playerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronación": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de España": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

document.title = `${playerName} | Barça Database`;

document.querySelector('meta[name="description"]')
?.setAttribute(
    "content",
    `${playerName} statistics, appearances, goals and assists for FC Barcelona.`
);

const canonical = document.querySelector('link[rel="canonical"]');

if (canonical) {
    canonical.href = location.href;
}

document.querySelector('link[rel="canonical"]')
?.setAttribute(
    "href",
    `https://barcadb.com/player.html?name=${encodeURIComponent(playerName)}`
);

let allMatches = [];
let allPlayers = [];

Promise.all([
fetch("data.json").then(r=>r.json()),
fetch("players.json").then(r=>r.json())
])
.then(([data,players])=>{

    allMatches = data;
    allPlayers = players;

    renderPlayer(playerName,data,players);

    initPersonSearch();

});

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function statValue(value){
    return value === 0 ? "-" : value;
}

function renderPlayer(player,data,players){

const playerInfo =
players.find(p => p.Player === player);

const playerMatches = [];

data.forEach(match=>{

let appeared = false;

for(let i=1;i<=11;i++){

    if(match[`Player name ${i}`]===player){
        appeared = true;
    }

    if(match[`Opp. Player name ${i}`]===player){
        appeared = true;
    }

}

for(let i=1;i<=6;i++){

if(
match[`Sub on ${i}`]===player ||
match[`Opp. Sub on ${i}`]===player
){
appeared = true;
}

}

if(appeared){
playerMatches.push(match);
}

});

playerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const barcaMatches = playerMatches.filter(match => {

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`] === player){
            return true;
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`] === player){
            return true;
        }

    }

    return false;

});

const debut =
barcaMatches.length
? barcaMatches[0]
: null;

const lastMatch =
barcaMatches.length
? barcaMatches[barcaMatches.length - 1]
: null;

let nationality =
playerInfo?.["Nationality 1"] || "";

if(playerInfo?.["Nationality 2"]){

nationality +=
" / " +
playerInfo["Nationality 2"];

}

const clubStats = {};

data.forEach(match=>{

    let forOpponent = false;
    let appeared = false;
    let bench = false;

    for(let i=1;i<=11;i++){

        if(match[`Player name ${i}`]===player){
            appeared = true;
        }

        if(match[`Opp. Player name ${i}`]===player){
            appeared = true;
            forOpponent = true;
        }

    }

    for(let i=1;i<=6;i++){

        if(match[`Sub on ${i}`]===player){
            appeared = true;
        }

        if(match[`Opp. Sub on ${i}`]===player){
            appeared = true;
            forOpponent = true;
        }

    }

    for(let i=1;i<=12;i++){
    
        if(match[`On the bench name ${i}`]===player){
            bench = true;
        }
    
        if(match[`Opp. On the bench name ${i}`]===player){
            bench = true;
            forOpponent = true;
        }

    }

    if(!appeared){
        return;
    }
    
    const club = forOpponent
        ? match["Opp. Team"]
        : "FC Barcelona";
    
    if(!clubStats[club]){
    
        clubStats[club] = {
            seasons: new Set(),
            matches:0,
            goals:0,
            assists:0,
            penaltyGoals:0,
            missedPenalties:0,
            yellow:0,
            red:0
        };
    
    }
    
    clubStats[club].seasons.add(match.Season);
    if(appeared){
        clubStats[club].matches++;
    }

for(let i=1;i<=12;i++){

    if(
        match[`Goal Player ${i}`]===player ||
        match[`Opp. Goal Player ${i}`]===player
    ){
        clubStats[club].goals++;
    }

    if(
        match[`Assist Player ${i}`]===player ||
        match[`Opp. Assist Player ${i}`]===player
    ){
        clubStats[club].assists++;
    }

    if(
        match[`Yellow player ${i}`]===player ||
        match[`Opp. Yellow player ${i}`]===player
    ){
        clubStats[club].yellow++;
    }

    if(
        match[`Red player ${i}`]===player ||
        match[`Opp. Red player ${i}`]===player
    ){
        clubStats[club].red++;
    }

    let scored = null;

    if(match[`Penalty player ${i}`]===player){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty player ${i}`]===player){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        clubStats[club].penaltyGoals++;
    }

    if(scored==="not in"){
        clubStats[club].missedPenalties++;
    }

}

});

const clubs = Object.keys(clubStats)
.sort((a,b) => {

    if(a === "FC Barcelona") return -1;
    if(b === "FC Barcelona") return 1;

    return a.localeCompare(b);

});

const clubsText = clubs.map(club =>

    club === "FC Barcelona"
        ? club
        : `<a href="opponent.html?name=${encodeURIComponent(club)}">${club}</a>`

).join(", ");

const playerClub = clubsText;

document.getElementById("playerProfile").innerHTML=`

<div class="player-card">

<div class="player-info">

<h1>${player} (Player)</h1>

${playerClub ? `
<div class="player-club">
    ${playerClub}
</div>
` : ""}

<div class="player-meta">

${playerInfo?.["Full Name"] ? `

<div>
<b>Full Name:</b>
${playerInfo["Full Name"]}
</div>

` : ""}

${playerInfo?.["Date of Birth"] ? `

<div>
<b>Born:</b>
${playerInfo["Date of Birth"]}
(${calculateAge(
    playerInfo["Date of Birth"],
    playerInfo["Death Date"]
)})
</div>

` : ""}

${playerInfo?.["Death Date"] ? `

<div>
<b>Died:</b>
${playerInfo["Death Date"]}
</div>

` : ""}

${nationality ? `

<div>
<b>Nationality:</b>
${nationality}
</div>

` : ""}

${playerInfo?.Position ? `

<div>
<b>Main Position:</b>
${playerInfo.Position}
</div>

` : ""}

${debut ? `
<div>
    <b>Debut:</b>
    <a href="match.html?id=${debut.ID}">
        ${debut.Date} vs ${debut["Opp. Team"]} (${debut.Result})
    </a>
</div>
` : ""}


${lastMatch ? `

<div>
<b>Last Match:</b>
<a href="match.html?id=${lastMatch.ID}"> 
    ${lastMatch.Date} vs ${lastMatch["Opp. Team"]} (${lastMatch.Result})
</a>
</div>

` : ""}

</div>

</div>

</div>
`;

document.getElementById("playerContent").innerHTML = `

<div class="widget-title">
Statistics
</div>

${Object.entries(clubStats)

.sort(([clubA],[clubB]) => {

    if(clubA === "FC Barcelona") return -1;
    if(clubB === "FC Barcelona") return 1;

    return clubA.localeCompare(clubB);

})

.map(([club,s]) => `

<div class="widget-title club-title">
${club}
</div>

<div class="summary-grid ${club !== 'FC Barcelona' ? 'opponent-career' : ''}">

    <div class="summary-box">
        <b>${s.seasons.size}</b>
        Seasons
    </div>

    <div class="summary-box">
        <b>${statValue(s.matches)}</b>
        Matches
    </div>

    <div class="summary-box">
        <b>${statValue(s.goals)}</b>
        Goals
    </div>

    <div class="summary-box">
        <b>${statValue(s.assists)}</b>
        Assists
    </div>

    <div class="summary-box">
        <b>${statValue(s.penaltyGoals)}</b>
        Penalty Goals
    </div>

    <div class="summary-box">
        <b>${statValue(s.missedPenalties)}</b>
        Missed Penalties
    </div>

    <div class="summary-box">
        <b>${statValue(s.yellow)}</b>
        Yellow
    </div>

    <div class="summary-box">
        <b>${statValue(s.red)}</b>
        Red
    </div>

</div>

`).join("")}

<div class="widget-title">
Season Breakdown
</div>

<div class="widget-card">

<table class="stats-table">

<thead>
<tr>
<th>Season</th>
<th><span class="desktop">Matches</span><span class="mobile">M</span></th>
<th><span class="desktop">Goals</span><span class="mobile">G</span></th>
<th><span class="desktop">Assists</span><span class="mobile">A</span></th>
<th><span class="desktop">Penalty Goal</span><span class="mobile">PG</span></th>
<th><span class="desktop">Missed Penalties</span><span class="mobile">MP</span></th>
<th><span class="desktop">Yellow Card</span><span class="mobile">YC</span></th>
<th><span class="desktop">Red Card</span><span class="mobile">RC</span></th>
</tr>
</thead>

<tbody id="seasonRows">
</tbody>

</table>

</div>

`;

document.getElementById("playerSidebar").innerHTML = `

<div class="widget-title">
    Career Summary
</div>

`;

renderSeasonStats(player,data);

}

function toggleSeason(id){

document
.getElementById(id)
.classList.toggle("active");

}

function renderSeasonStats(player,data){

const stats={};

data.forEach(match=>{

let appeared=false;
let forBarca=false;
let forOpponent=false;

for(let i=1;i<=11;i++){

if(match[`Player name ${i}`]===player){
    appeared=true;
    started=true;
    forBarca=true;
}

if(match[`Opp. Player name ${i}`]===player){
    appeared=true;
    started=true;
    forOpponent=true;
}

}

for(let i=1;i<=6;i++){

    if(match[`Sub on ${i}`]===player){
        appeared=true;
        forBarca=true;
    }

    if(match[`Opp. Sub on ${i}`]===player){
        appeared=true;
        forOpponent=true;
    }

}

let played = appeared;

if(!played){
return;
}

const season=match.Season;

if(!stats[season]){

stats[season]={
matches:0,
goals:0,
penaltyGoals:0,
missedPenalties:0,
assists:0,
yellow:0,
red:0,
opponentClub:false,
games:[]
};

}

if(forOpponent){
    stats[season].opponentClub = true;
}

if(played){
    stats[season].matches++;
}

for(let i=1;i<=12;i++){

    if(
        match[`Goal Player ${i}`]===player ||
        match[`Opp. Goal Player ${i}`]===player
    ){
        stats[season].goals++;
    }

    if(
        match[`Assist Player ${i}`]===player ||
        match[`Opp. Assist Player ${i}`]===player
    ){
        stats[season].assists++;
    }

    if(
        match[`Yellow player ${i}`]===player ||
        match[`Opp. Yellow player ${i}`]===player
    ){
        stats[season].yellow++;
    }

    if(
        match[`Red player ${i}`]===player ||
        match[`Opp. Red player ${i}`]===player
    ){
        stats[season].red++;
    }

    let scored = null;

    if(match[`Penalty player ${i}`]===player){
        scored = match[`Penalty scored ${i}`];
    }

    if(match[`Opp. Penalty player ${i}`]===player){
        scored = match[`Opp. Penalty scored ${i}`];
    }

    if(scored==="in"){
        stats[season].penaltyGoals++;
    }

    if(scored==="not in"){
        stats[season].missedPenalties++;
    }

}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle = document.getElementById("menuToggle");
    const menuOverlay = document.getElementById("menuOverlay");
    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});
