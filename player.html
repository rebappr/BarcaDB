function getClubLogo(team){
    return String(team || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        + ".png";
}

function getPositionGroup(position){

    const defenders = [
        "Centre Back",
        "Left Back",
        "Right Back"
    ];

    const midfielders = [
        "Defensive Midfield",
        "Central Midfield",
        "Attacking Midfield",
        "Left Midfield",
        "Right Midfield"
    ];

    const forwards = [
        "Centre Forward",
        "Left Wing",
        "Right Wing",
        "Second Striker"
    ];

    if(position === "Goalkeeper") return "Goalkeeper";
    if(defenders.includes(position)) return "Defender";
    if(midfielders.includes(position)) return "Midfielder";
    if(forwards.includes(position)) return "Forward";

    return "Other";
}

const urlParams =
    new URLSearchParams(window.location.search);

const playerName =
    urlParams.get("name") ||
    "Lamine Yamal";

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",

    "UEFA Cup": "uefa-cup.png",

};

function getCompetitionShortName(comp){

        "UEFA Champions League":"UCL",
		"UEFA Europa League":"UEL",
        "Copa del Rey":"Copa",
        "Supercopa de España":"Supercopa",
        "FIFA Club World Cup":"CWC",
        "La Liga":"La Liga",
    	"Copa de la Liga": "Copa Liga",
    	"Copa de la Coronación": "Copa",
    	"Cup Winners' Cup": "CWC",
    	"UEFA Super Cup": "UEFA SC",
    	"UEFA Cup": "UEFA Cup",
    	"Inter-Cities Fairs Cup": "ICFC",
    	"European Cup": "EC"

    };

    return names[comp] || comp;

}

function getCountryLogo(country){

    const code =
        window.getCountryCode
        ? window.getCountryCode(country)
        : "default";

    return `logos/countries/${code}.png`;
}

function getNationalities(player){

    return [
        player["Nationality 1"],
        player["Nationality 2"]
    ].filter(Boolean);

}

function renderNationalityFlags(player){

    const nationality =
        player["Nationality 1"];

    if(!nationality){
        return "";
    }

    return `
        <img
            src="${getCountryLogo(nationality)}"
            alt="${nationality}"
            class="player-flag-large"
            onerror="this.src='logos/countries/default.png'"
        >
    `;

}

function parseMinute(value){

    if(!value){
        return 0;
    }

    value = String(value);

    if(value.includes("+")){

        const [base, added] =
            value.split("+");

        return Number(base) +
               Number(added);

    }

    return Number(value);

}

function isGoalkeeper(position){

    const pos =
        String(position || "")
        .toUpperCase()
        .trim();

    return (
        pos === "GK" ||
        pos.includes("GOALKEEPER")
    );

}

function calculateAge(dateString, deathDate = null){

    if(!dateString){
        return "";
    }

    const [day, month, year] =
        dateString.split(".");

    const birthDate =
        new Date(year, month - 1, day);

    const endDate = deathDate
        ? new Date(
            deathDate.split(".").reverse().join("-")
          )
        : new Date();

    let age =
        endDate.getFullYear() -
        birthDate.getFullYear();

    const monthDiff =
        endDate.getMonth() -
        birthDate.getMonth();

    if(
        monthDiff < 0 ||
        (
            monthDiff === 0 &&
            endDate.getDate() < birthDate.getDate()
        )
    ){
        age--;
    }

    return age;
}

function populateCompetitionFilter(playerName){

    const competitions = new Set();

    allMatches.forEach(match => {

        let played = false;

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`] === playerName){

                played = true;
                break;

            }

        }

        if(!played){

            for(let i = 1; i <= 12; i++){

                if(
                    match[`On the bench name ${i}`] === playerName
                ){

                    played = true;
                    break;

                }

            }

        }

        if(
            played &&
            (
                selectedSeason === "all" ||
                match.Season === selectedSeason

            competitions.add(
                match.Competition

    });

    document.getElementById(

		        ? "active"

    attachCompetitionEvents();

            );

            btn.classList.add("active");

            selectedCompetition =

            renderActiveSection();

        });

    });

}

function getPlayerMatches(playerName){

    const matches = [];

    allMatches.forEach(match => {

        let played = false;
        let starter = false;
        let minutes = 0;

		const matchLength =
		    String(match.Result || "").includes("AET") ||
		    String(match.Result || "").includes("P")
		        ? 120
		        : 90;

        for(let i = 1; i <= 11; i++){

            if(
                match[`Player name ${i}`] === playerName
            ){

                played = true;
                starter = true;

                let subOffMinute = null;

                for(let s = 1; s <= 6; s++){

                    if(
                        match[`Sub off ${s}`] === playerName
                    ){

                        subOffMinute =
                            parseMinute(
                                match[`Sub min ${s}`]
                            );

                        break;

                    }

                }

				minutes =
				    subOffMinute !== null
				        ? subOffMinute
				        : matchLength;

                break;

            }

        }

        if(!starter){

            for(let i = 1; i <= 6; i++){

                if(
                    match[`Sub on ${i}`] === playerName
                ){

                    played = true;

                    const minute =
                        parseMinute(
                            match[`Sub min ${i}`]
                        );

                    minutes =
    					matchLength - minute;

                    break;

                }

            }

        }

        if(!played){
            return;
        }

        let goals = 0;
        let assists = 0;
        let yellow = 0;
        let red = 0;
        let penaltyGoals = 0;
        let penaltyMissed = 0;

        for(let i = 1; i <= 12; i++){

            if(
                match[`Goal Player ${i}`] === playerName
            ){
                goals++;
            }

            if(
                match[`Assist Player ${i}`] === playerName
            ){
                assists++;
            }

            if(
                match[`Yellow player ${i}`] === playerName
            ){
                yellow++;
            }

            if(
                match[`Red player ${i}`] === playerName
            ){
                red++;
            }

            if(
                match[`Penalty player ${i}`] === playerName
            ){

                if(
                    match[`Penalty scored ${i}`] === "in"
                ){
                    penaltyGoals++;
                }

                if(
                    match[`Penalty scored ${i}`] === "not in"
                ){
                    penaltyMissed++;
                }

            }

        }

        matches.push({

            match,
            played,
            starter,
            minutes,

            goals,
            assists,

            yellow,
            red,

            penaltyGoals,
            penaltyMissed,

            cleanSheet:
                Number(match.Conceded) === 0,

            goalsConceded:
                Number(match.Conceded) || 0

        });

    });

    return matches;

}

function getPlayerAggregateStats(
    playerName,
    {
        season = null,
        competition = null
    } = {}
){
    const currentPlayer =
        allPlayers.find(
            p => p.Name === playerName
        );

    const isGK =
        isGoalkeeper(
            currentPlayer?.Position
        );

    const stats = {

        seasons:new Set(),

        matches:0,
        starts:0,
        minutes:0,

        goals:0,
        assists:0,

        penaltyGoals:0,
        penaltyMissed:0,

        yellow:0,
        red:0,

        cleanSheets:0,
        goalsConceded:0

    };

    const playerMatches =
        getPlayerMatches(playerName);

    playerMatches.forEach(item => {

        if(
            season &&
            item.match.Season !== season
        ){
            return;
        }

        if(
            competition &&
            item.match.Competition !== competition
        ){
            return;
        }

        stats.seasons.add(
            item.match.Season
        );

        stats.matches++;

        if(item.starter){
            stats.starts++;
        }

        stats.minutes +=
            item.minutes;

        stats.goals +=
            item.goals;

        stats.assists +=
            item.assists;

        stats.penaltyGoals +=
            item.penaltyGoals;

        stats.penaltyMissed +=
            item.penaltyMissed;

        stats.yellow +=
            item.yellow;

        stats.red +=
            item.red;

        if(isGK){

            stats.goalsConceded +=
                item.goalsConceded;

            if(item.cleanSheet){
                stats.cleanSheets++;
            }

        }

    });

    return stats;
}

function updatePlayerStats(){

    const stats =
        getPlayerAggregateStats(
            playerName,
            {
                season:
                    selectedSeason === "all"
                    ? null
                    : selectedSeason,

                competition:
                    selectedCompetition === "all"
                    ? null
                    : selectedCompetition
            }
        );

    renderSummary(stats);

}

function updateRatingVisibility(){

    if(activeSection !== "stats"){

        ratingCard.style.display = "none";

    }

function initSections(){

    document
    .querySelectorAll(
        ".player-section-btn"
    )
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => {

                document
                .querySelectorAll(
                    ".player-section-btn"
                )
                .forEach(b =>
                    b.classList.remove("active")
                );

                btn.classList.add("active");

                activeSection =
                    btn.dataset.section;

				const seasonSection =
				    document.querySelector(".filter-section.season");

				const filtersCard =
    				document.querySelector(".player-filters-card");
				
				const ratingCard =
				    document.getElementById("ratingCard");
				
				if(activeSection === "info"){
				
				    filtersCard.style.display = "none";
				
				}else{
				
				    filtersCard.style.display = "";
				
				if(activeSection === "career"){
				
				    seasonSection.style.display = "none";
				
				    populateCareerCompetitionFilter(
				        playerName
				    );
				
				}else{
				
				    seasonSection.style.display = "";
				
				    populateCompetitionFilter(
				        playerName
				    );
				
				}
				
				ratingCard.style.display =
				    activeSection === "stats"
				        ? "flex"
				        : "none";
				}
				
				document
				.getElementById("infoSection")
				.style.display =
				    activeSection === "info"
				    ? "block"
				    : "none";
				
				document
				.getElementById("statsSection")
				.style.display =
				    activeSection === "stats"
				    ? "block"
				    : "none";
				
				document
				.getElementById("matchesSection")
				.style.display =
				    activeSection === "matches"
				    ? "block"
				    : "none";
				
				document
				.getElementById("careerSection")
				.style.display =
				    activeSection === "career"
				    ? "block"
				    : "none";

                renderActiveSection();

            }
        );

    });

}

    if(activeSection === "info"){

function renderPlayerMatches(){

    const matches = [];

    allMatches.forEach(match => {

        if(
            selectedSeason !== "all" &&
            match.Season !== selectedSeason
        ){
            return;
        }

        if(
            selectedCompetition !== "all" &&
            match.Competition !== selectedCompetition
        ){
            return;
        }

        let started = false;
        let appeared = false;

        for(let i = 1; i <= 11; i++){

            if(
                match[`Player name ${i}`] === playerName
            ){
                started = true;
                appeared = true;
                break;
            }

        }

        if(!appeared){

            for(let i = 1; i <= 6; i++){

                if(
                    match[`Sub on ${i}`] === playerName
                ){
                    appeared = true;
                    break;
                }

            }

        }

		if(!appeared){
		    return;
		}
		
		let goals = 0;
		let assists = 0;
		let penaltyGoals = 0;
		let yellow = 0;
		let red = 0;
		
		for(let i = 1; i <= 12; i++){
		
		    if(match[`Goal Player ${i}`] === playerName){
		        goals++;
		    }
		
		    if(match[`Assist Player ${i}`] === playerName){
		        assists++;
		    }
		
		    if(match[`Yellow player ${i}`] === playerName){
		        yellow++;
		    }
		
		    if(match[`Red player ${i}`] === playerName){
		        red++;
		    }
		
		    if(match[`Penalty player ${i}`] === playerName){
		
		        if(match[`Penalty scored ${i}`] === "in"){
		            penaltyGoals++;
		        }
		
		    }
		
		}

		const ratingData =
		    allRatings[playerName];
		
		const matchHistory =
		    ratingData?.history || [];
		
		const matchRatingData =
		    matchHistory.find(
		        item =>
		            item.matchId == match.ID
		    );
		
		const matchRating =
		    matchRatingData?.rating;

		matches.push({
		
		    ...match,
		
		    started,
		
		    goals,
		    assists,
		    penaltyGoals,
		
		    yellow,
		    red,
		
		    cleanSheet:
		        Number(match.Conceded) === 0
		            ? 1
		            : 0,
		
		    goalsConceded:
		        Number(match.Conceded) || 0,
		
			rating:
			    matchRating
		
		});
		});

    matches.sort((a,b)=>{

        const da =
            new Date(
                a.Date.split(".")
                .reverse()
                .join("-")
            );

        const db =
            new Date(
                b.Date.split(".")
                .reverse()
                .join("-")
            );

        return db - da;

    });

	const currentPlayer =
	    allPlayers.find(
	        p => p.Name === playerName
	    );
	
	const position =
	    currentPlayer?.Position || "";
	
	const isGK =
	    isGoalkeeper(position);

	document.getElementById(
	    "matchesSection"
	).innerHTML = `

        <div class="matches-list ${isGK ? 'gk' : ''}">

			<div class="matches-header">
			
			    <div></div>

			    <div>Opponent</div>
			    <div>Result</div>
			
			    ${
			        isGK
			        ? `
			            <div>RT</div>
			            <div>CS</div>
			            <div>GC</div>
			            <div>YC</div>
			            <div>RC</div>
			        `
			        : `
			            <div>RT</div>
			            <div>G</div>
			            <div>A</div>
			            <div>PG</div>
			            <div>YC</div>
			            <div>RC</div>
			        `
			    }
			
			</div>

            ${matches.map(match => `

                <div
                    class="player-match ${
                        match.started
                        ? "player-started"
                        : "player-bench"
                    }"
                    onclick="
                        location.href=
                        'match.html?id=${match.ID}'
                    ">

                    <div class="competition-cell">

                        ${
                            competitionLogos[
                                match.Competition
                            ]
                            ? `

                                src="logos/${competitionLogos[match.Competition]}"
                                class="competition-logo">
                            `
                            : ""
                        }

                    </div>

                    <div>
                        ${match.Date}
                    </div>

                    <div>
                        ${match["Home/Away"]}
                    </div>

                    <div class="opponent-cell">

                        <img
                            src="logos/clubs/${getClubLogo(match["Opp. Team"])}"

                            onerror="
                                this.src='logos/clubs/default.png'
                            ">

                        ${match["Opp. Team"]}

                    </div>

                    <div>

                        <span class="result-badge ${
                            match["Result type"] === "W"
                            ? "result-win"
                            : match["Result type"] === "D"
                            ? "result-draw"
                            : "result-loss"
                        }">

                            ${match.Result}

                        </span>

                    </div>

					${
					    isGK
					    ? `
					
							<div>
							    ${
							        match.rating
							        ? `
							            <span class="match-rating">
							                ${match.rating.toFixed(2)}
							            </span>
							        `
							        : "-"
							    }
							</div>
					
					        <div>${match.cleanSheet}</div>
					
					        <div>${match.goalsConceded}</div>
					
					        <div>${match.yellow || "-"}</div>
					
					        <div>${match.red || "-"}</div>
					
					    `
					    : `
					
							<div>
							    ${
							        match.rating
							        ? `
							            <span class="match-rating">
							                ${match.rating.toFixed(2)}
							            </span>
							        `
							        : "-"
							    }
							</div>
					
					        <div>${match.goals || "-"}</div>
					
					        <div>${match.assists || "-"}</div>
					
					        <div>${match.penaltyGoals || "-"}</div>
					
					        <div>${match.yellow || "-"}</div>
					
					        <div>${match.red || "-"}</div>
					
					    `
					}

					<div class="mobile-match-stats">

						<div class="mobile-stats-header">
						
						    ${
						        isGK
						        ? `
						            <span>RT</span>
						            <span>CS</span>
						            <span>GC</span>
						            <span>YC</span>
						            <span>RC</span>
						        `
						        : `
						            <span>RT</span>
						            <span>G</span>
						            <span>A</span>
						            <span>PG</span>
						            <span>YC</span>
						            <span>RC</span>
						        `
						    }
						
						</div>
					
						<div class="mobile-stats-values">
						
						    ${
						        isGK
						        ? `
						
						            <span class="match-rating">
						                ${match.rating ? match.rating.toFixed(2) : "-"}
						            </span>
						
						            <span>${match.cleanSheet}</span>
						
						            <span>${match.goalsConceded}</span>
						
						            <span>${match.yellow || "-"}</span>
						
						            <span>${match.red || "-"}</span>
						
						        `
						        : `
						
						            <span class="match-rating">
						                ${match.rating ? match.rating.toFixed(2) : "-"}
						            </span>
						
						            <span>${match.goals || "-"}</span>
						
						            <span>${match.assists || "-"}</span>
						
						            <span>${match.penaltyGoals || "-"}</span>
						
						            <span>${match.yellow || "-"}</span>
						
						            <span>${match.red || "-"}</span>
						
						        `
						    }
						
						</div>
					
					</div>

                </div>

            `).join("")}

        </div>

    `;
}

function initFilters(){

    document
    .getElementById("seasonFilter")
    ?.addEventListener("change", e => {

        selectedSeason = e.target.value;

        selectedCompetition = "all";

        const currentPlayer =
            allPlayers.find(
                p => p.Name === playerName
            );

        renderPlayer(currentPlayer);

        populateCompetitionFilter(
            playerName
        );

        renderActiveSection();

    });

}

function populateCareerCompetitionFilter(playerName){

    const competitions = new Set();

    allMatches.forEach(match => {

        let played = false;

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`] === playerName){
                played = true;
                break;
            }

        }

        if(!played){

            for(let i = 1; i <= 12; i++){

                if(match[`On the bench name ${i}`] === playerName){
                    played = true;
                    break;
                }

            }

        }

        if(played){
            competitions.add(match.Competition);
        }

    });

    document.getElementById("competitionContainer").innerHTML = `

        <button
		    class="competition-btn ${
		        selectedCareerCompetition === "all"
		            ? "active"
		            : ""
		    }"
		    data-career-comp="all">
            All
        </button>

        ${[...competitions]
            .sort()
            .map(comp => `
                <button
				    class="competition-btn ${
				        selectedCareerCompetition === comp
				            ? "active"
				            : ""
				    }"
				    data-career-comp="${comp}">
                    ${getCompetitionShortName(comp)}
                </button>
            `)
            .join("")}
    `;

    attachCareerCompetitionEvents();

}

function attachCareerCompetitionEvents(){

    document
        .querySelectorAll("[data-career-comp]")
        .forEach(btn => {

            btn.addEventListener("click", () => {

                document
                    .querySelectorAll("[data-career-comp]")
                    .forEach(b => b.classList.remove("active"));

                btn.classList.add("active");

                selectedCareerCompetition =
                    btn.dataset.careerComp;

                renderCareerOverview();

            });

        });

}

function populateSeasonFilter(playerName){

    const seasons = new Set();

    allMatches.forEach(match => {

        let found = false;

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`] === playerName){

                found = true;
                break;

            }

        }

        if(!found){

            for(let i = 1; i <= 12; i++){

                if(match[`On the bench name ${i}`] === playerName){

                    found = true;
                    break;

                }

            }

        }

        if(found){

            seasons.add(match.Season);

        }

    });

    const seasonFilter =
        document.getElementById(
            "seasonFilter"
        );

    seasonFilter.innerHTML =

        [...seasons]
            .sort()
            .reverse()
            .map(season => `
                <option value="${season}">
                    ${season}
                </option>
            `)
            .join("");

    const latestSeason =
        [...seasons]
            .sort()
            .reverse()[0];

    if(latestSeason){

        seasonFilter.value =
            latestSeason;

        selectedSeason =
            latestSeason;

    }

}

Promise.all([
    fetch("/data/players.json").then(r => r.json()),
    fetch("/data/data.json").then(r => r.json()),
    fetch("/data/player-ratings.json").then(r => r.json())
])
.then(([players, matches, ratings]) => {

    allMatches = matches;

    allPlayers = players.map(p => ({
        ...p,
        Name: p.Player
    }));

    allRatings = ratings;

    const player =
        allPlayers.find(
            p => p.Name === playerName
        );

    initPersonSearch();

    if(!player){

        document.getElementById("playerProfile")
            .innerHTML = "<p>Player not found.</p>";

        return;
    }
	
	populateSeasonFilter(
	    player.Name
	);
	
	renderPlayer(player);
	
	populateCompetitionFilter(
	    player.Name
	);
	
	initFilters();
	
	initSections();
	
	renderActiveSection();

	updateRatingVisibility();

})
.catch(console.error);

function initPersonSearch(){

	if(!allMatches.length){
	    return;
	}

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Team"]){

            searchItems.set(
                `opponent-${match["Opp. Team"]}`,
                {
                    name: match["Opp. Team"],
                    type: "Opponent"
                }
            );

        }

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        for(let i = 1; i <= 12; i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    const input =
        document.getElementById(
            "sidebarPersonSearch"
        );

    const results =
        document.getElementById(
            "sidebarSearchResults"
        );

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name
                    .toLowerCase()
                    .includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">

                ${filtered.map(item => {

                    let url = "player.html?name=" +
                        encodeURIComponent(item.name);

                    if(item.type === "Manager"){

                        url =
                        "manager.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    if(item.type === "Opponent"){

                        url =
                        "opponent.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    return `

                        <a
                            class="player-search-item"
                            href="${url}">

                            ${item.name}

                            <span class="search-type ${item.type.toLowerCase()}">
                                (${item.type})
                            </span>

                        </a>

                    `;

                }).join("")}

            </div>
        `;

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        }, 200);

    });

}
