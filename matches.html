.content-layout.animate{

<script>

function getClubLogo(team){
    return String(team || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        + ".png";
}

let allMatches = [];
let matchesView = "all";

let selectedCompetition = "All";
let selectedVenue = "All";

const competitionLogos = {
"Copa del Rey": "copa.png",
"Copa de la Liga": "copa-liga.png",
"Copa de la Coronación": "copa.png",
"FIFA Club World Cup": "fifa.png",
"Qualification for La Liga": "laliga.png",
"La Liga": "laliga.png",
"Supercopa de España": "supercopa.png",
"UEFA Champions League": "ucl.png",
"Cup Winners' Cup": "cwc.png",
"UEFA Europa League": "europa.png",
"UEFA Super Cup": "uefa-supercup.png",
"UEFA Cup": "uefa-cup.png",
"Inter-Cities Fairs Cup": "inter-cup.png",
"European Cup": "ec.png"
};

function renderMatches(){

    let seasonMatches =
        [...allMatches];

    if(selectedCompetition !== "All"){

        seasonMatches =
            seasonMatches.filter(
                match =>
                match.Competition === selectedCompetition
            );

    }

    if(selectedVenue !== "All"){

        seasonMatches =
            seasonMatches.filter(
                match =>
                match["Home/Away"] === selectedVenue
            );

    }

    document.getElementById(
        "seasonMatches"
    ).innerHTML =
        buildCurrentSeasonMatches(
            seasonMatches
        );

}

function renderMatchesFilters(){

    const competitions =
        [...new Set(
            allMatches.map(
                m => m.Competition
            )
        )]
        .sort();

    const switcher =
        document.getElementById(
            "competitionSwitch"
        );

    switcher.innerHTML = `

        <button
            data-competition="All"
            class="${
                selectedCompetition === "All"
                ? "active"
                : ""
            }"
            onclick="setCompetitionFilter('All')">

            All

        </button>

        ${competitions.map(comp => `

            <button
                data-competition="${comp}"
                class="${
                    selectedCompetition === comp
                    ? "active"
                    : ""
                }"
                onclick="setCompetitionFilter('${comp}')">

                ${
                    comp
                        .replace("UEFA Champions League","UCL")
                        .replace("Copa del Rey","Copa")
                        .replace("Supercopa de España","Supercopa")
                }

            </button>

        `).join("")}

    `;

}

function setCompetitionFilter(competition){

    selectedCompetition = competition;

    document
        .querySelectorAll("[data-competition]")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    document
        .querySelector(
            `[data-competition="${competition}"]`
        )
        ?.classList.add("active");

    renderMatches();

}

function setVenueFilter(venue){

    selectedVenue = venue;

    document
        .querySelectorAll("[data-venue]")
        .forEach(btn =>
            btn.classList.remove("active")
        );

    document
        .querySelector(`[data-venue="${venue}"]`)
        ?.classList.add("active");

    renderMatches();

}

function setMatchesView(view){

    matchesView = view;

    document
        .querySelectorAll('[data-view]')
        .forEach(btn => btn.classList.remove('active'));

    document
        .querySelector(`[data-view="${view}"]`)
        ?.classList.add('active');

    renderMatches();
}

function buildMatchRow(match){

let resultClass = "result-draw";

if(match["Result type"] === "W")
resultClass = "result-win";

if(match["Result type"] === "L")
resultClass = "result-loss";

return `

       <div class="matches-line"
            onclick="location.href='match.html?id=${match.ID}'">

           <div>
               ${match.Date}
           </div>

			<div class="competition-cell">
			    ${
			        competitionLogos[match.Competition]
			        ? `
			        <img src="logos/${competitionLogos[match.Competition]}" alt="${match.Competition}">
			        `
			        : ""
			    }
			    <span>${match.Competition}</span>
			</div>

			<div class="opponent-cell">
			
				<img
				    src="logos/clubs/${getClubLogo(match['Opp. Team'])}"
				    alt="${match['Opp. Team']}"
				    onerror="this.src='logos/clubs/default.png'">
			
			    ${
			    match['Opp. Team'] !== 'FC Barcelona'
			    ? `<a href="opponent.html?name=${encodeURIComponent(match['Opp. Team'])}"
			          class="opponent-link"
			          onclick="event.stopPropagation();">
			          ${match['Opp. Team']}
			       </a>`
			    : match['Opp. Team']
			    }
			
			</div>

           <div>
               ${match["Home/Away"]}
           </div>

           <div>

               <span class="result-badge ${resultClass}">
                   ${match.Result}
               </span>

           </div>

       </div>

   `;
}

function buildCurrentSeasonMatches(data){

let matches = [...data]
.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da - db;

});

let html = "";

if(matchesView === "competition"){

const grouped = {};

matches.forEach(match => {

if(!grouped[match.Competition]){
grouped[match.Competition] = [];
}

grouped[match.Competition].push(match);

});

Object.keys(grouped).forEach(comp => {

html += `
		            <div class="competition-title">
		                ${comp}
		            </div>
		        `;

grouped[comp].forEach(match => {

html += buildMatchRow(match);

});

});

return html;
}

if(matchesView === "upcoming"){

matches = matches.filter(
x => x.Result === "-:-"
);

}

if(matchesView === "completed"){

matches = matches.filter(
x => x.Result &&
x.Result !== "-:-"
);

}

if(
    matchesView === "all" ||
    matchesView === "upcoming" ||
    matchesView === "completed"
){

    const grouped = {};

    matches.forEach(match => {

        const d =
        new Date(
            match.Date.split(".").reverse().join("-")
        );

        const month =
        d.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );

        if(!grouped[month]){
            grouped[month] = [];
        }

        grouped[month].push(match);
    });

    Object.keys(grouped).forEach(month => {

        html += `
            <div class="competition-title">
                ${month}
            </div>
        `;

        grouped[month].forEach(match => {
            html += buildMatchRow(match);
        });

    });

    return html;
}

}

Promise.all([
    fetch("/data/data.json").then(r => r.json()),
    fetch("/data/current-season.json").then(r => r.json())
])
.then(([historyData, currentData]) => {

    const latestSeason =
        [...new Set(
            historyData.map(m => m.Season)
        )]
        .sort()
        .reverse()[0];

    allMatches =
        historyData.filter(
            m => m.Season === latestSeason
        );

    function normalizeName(name){

        return String(name || "")
            .toLowerCase()
            .replace(/\./g,"")
            .replace(/\bfc\b/g,"")
            .replace(/\bcf\b/g,"")
            .replace(/\s+/g," ")
            .trim();

    }

    currentData.forEach(currentMatch => {

        const match =
            allMatches.find(m =>

                m.Date === currentMatch.Date &&
                m.Competition === currentMatch.Competition &&
                m["Home/Away"] === currentMatch["Home/Away"] &&
                normalizeName(m["Opp. Team"]) ===
                normalizeName(currentMatch["Opp. Team"])

            );

        if(match){

            match.Result =
                currentMatch.Result;

        }

    });

    allMatches.forEach(match => {

        if(
            !match.Result ||
            match.Result === "-:-" ||
            !match.Result.includes(":")
        ){
            return;
        }

        const [homeGoals, awayGoals] =
            match.Result.split(":").map(Number);

        if(match["Home/Away"] === "Home"){

            match["Result type"] =
                homeGoals > awayGoals ? "W" :
                homeGoals < awayGoals ? "L" : "D";

        }else{

            match["Result type"] =
                awayGoals > homeGoals ? "W" :
                awayGoals < homeGoals ? "L" : "D";

        }

    });

    renderMatchesFilters();
    renderMatches();
    initPersonSearch();

})
.catch(error =>
    console.error(error)
);

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}

attachSearch(
    "sidebarPersonSearch",
    "sidebarSearchResults"
);

}

</script>
