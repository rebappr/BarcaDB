name: Build Player Data

on:
  push:
    paths:
      - 'data/matches/**'
      - 'scripts/**'
      - 'data/playerNameMap.js'

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build History
        run: node scripts/build-player-history.js

      - name: Build Ratings
        run: node scripts/calculate-player-ratings.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/players-history.json
          git add data/player-ratings.json

          git diff --cached --quiet || git commit -m "Update player data"

          git push
