name: Build Player History

on:
  push:
    paths:
      - 'data/matches/**'
      - 'scripts/build-player-history.js'
      - 'data/playerNameMap.js'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Builder
        run: node scripts/build-player-history.js

      - name: Commit generated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/players-history.json

          git diff --cached --quiet || git commit -m "Update players-history.json"

          git push
