name: Update JSON

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Sheets
        run: |
          curl -L "https://opensheet.elk.sh/1DjlD21Srkmw2As8zcya6S51K6ZbF\_jasTvebHze4kVo/Database" -o data.json

          curl -L "https://opensheet.elk.sh/1DjlD21Srkmw2As8zcya6S51K6ZbF\_jasTvebHze4kVo/PlayersData" -o players.json

          curl -L "https://opensheet.elk.sh/1DjlD21Srkmw2As8zcya6S51K6ZbF\_jasTvebHze4kVo/ManagersData" -o managers.json

          curl -L "https://opensheet.elk.sh/1DjlD21Srkmw2As8zcya6S51K6ZbF\_jasTvebHze4kVo/InterestingStats" -o interesting-stats.json

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data.json \
            players.json \
            managers.json \
            interesting-stats.json

          git diff --staged --quiet || git commit -m "Update data"

          git push