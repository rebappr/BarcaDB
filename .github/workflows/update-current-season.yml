name: Update Current Season

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update current season
        run: node scripts/update-current-season.js
        env:
          API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

      - name: Validate JSON
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

          jq empty data/current-season.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/current-season.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update current season"
          git push origin main
