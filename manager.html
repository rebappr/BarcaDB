function calculateAge(dateString, deathDate = null){

    if(!dateString){
        return "";
    }

    const [day, month, year] =
        dateString.split(".");

    const birthDate =
        new Date(year, month - 1, day);

    const endDate = deathDate
        ? new Date(
            deathDate.split(".").reverse().join("-")
          )
        : new Date();

    let age =
        endDate.getFullYear() -
        birthDate.getFullYear();

    const monthDiff =
        endDate.getMonth() -
        birthDate.getMonth();

    if(
        monthDiff < 0 ||
        (
            monthDiff === 0 &&
            endDate.getDate() < birthDate.getDate()
        )
    ){
        age--;
    }

    return age;
}

function getManagerAggregateStats(
    managerName,
    {
        season = null,
        competition = null
    } = {}
){

    const stats = {

        seasons:new Set(),

        matches:0,

        wins:0,
        draws:0,
        losses:0,

        goalsFor:0,
        goalsAgainst:0,

        cleanSheets:0

    };

    allMatches.forEach(match => {

        if(match.Manager !== managerName){
            return;
        }

        if(
            season &&
            match.Season !== season
        ){
            return;
        }

        if(
            competition &&
            match.Competition !== competition
        ){
            return;
        }

        stats.seasons.add(
            match.Season
        );

        stats.matches++;

        if(match["Result type"] === "W"){
            stats.wins++;
        }

        if(match["Result type"] === "D"){
            stats.draws++;
        }

        if(match["Result type"] === "L"){
            stats.losses++;
        }

        stats.goalsFor +=
            Number(match.Scored) || 0;

        stats.goalsAgainst +=
            Number(match.Conceded) || 0;

        if(Number(match.Conceded) === 0){
            stats.cleanSheets++;
        }

    });

    return stats;

}

function getManagerWinRate(stats){

    if(!stats.matches){
        return "0.00";
    }

    return (
        stats.wins * 100 /
        stats.matches
    ).toFixed(2);

}

function getManagersDropdown(){

    const managerLastMatch = {};

    allMatches.forEach(match => {

        if(!match.Manager) return;

        const date =
            new Date(
                match.Date.split(".").reverse().join("-")
            );

        if(
            !managerLastMatch[match.Manager] ||
            date > managerLastMatch[match.Manager]
        ){
            managerLastMatch[match.Manager] = date;
        }

    });

    const decades = {};

    Object.entries(managerLastMatch)
        .forEach(([manager, date]) => {

            const decade =
                Math.floor(date.getFullYear() / 10) * 10;

            if(!decades[decade]){
                decades[decade] = [];
            }

            decades[decade].push({
                manager,
                date
            });

        });

    return Object.keys(decades)
        .sort((a,b) => b - a)
        .map(decade => `

            <optgroup label="${decade}s">

                ${decades[decade]
                    .sort((a,b) => b.date - a.date)
                    .map(item => `
                        <option value="${item.manager}">
                            ${item.manager}
                        </option>
                    `)
                    .join("")}

            </optgroup>

        `)
        .join("");

}

            "click",
            () => {

                document
                .querySelectorAll(
                    ".manager-section-btn"

                .forEach(b =>
                    b.classList.remove("active")
                );

                btn.classList.add("active");

                activeSection =
                    btn.dataset.section;

				const seasonSection =
				    document.querySelector(".filter-section.season");
				
				const filtersCard =
				    document.querySelector(".manager-filters-card");
				
				if(activeSection === "info"){
				
				    filtersCard.style.display = "none";
				
				}else{
				
				    filtersCard.style.display = "";
				
				    if(activeSection === "career"){
				
				        seasonSection.style.display = "none";
				
				        populateCareerCompetitionFilter(
				            managerName
				        );
				
				    }else{
				
				        seasonSection.style.display = "";
				
				        populateCompetitionFilter(
				            managerName
				        );
				
				    }
				
				}

				    activeSection === "info"
				        ? "block"
				        : "none";
				
				document.getElementById("statsSection").style.display =
				    activeSection === "stats"

        );

                    );

                const db =
                    new Date(
                        b.Date.split(".").reverse().join("-")
                    );

                return da - db;

            });

    const firstMatch =
        managerMatches[0];

    const lastMatch =
        managerMatches[
            managerMatches.length - 1
        ];

    const seasons =
        new Set(
            managerMatches.map(
                match => match.Season
            )
        );

    document.getElementById(
        "managerInfoContent"
    ).innerHTML = `

        <div class="info-card">

            <h3>
                Manager Information
            </h3>

            <div class="info-grid">

				<div class="info-item">
				    <span>Full Name</span>
				    <strong>
				        ${manager?.["Full Name"] || managerName}
				    </strong>
				</div>
				
				<div class="info-item">
				    <span>Birth Date</span>
				    <strong>
				        ${
				            manager?.["Date of Birth"]
				            ? `${manager["Date of Birth"]} (${calculateAge(
				                    manager["Date of Birth"],
				                    manager?.["Death Date"] || null
				              )})`
				            : "-"
				        }
				    </strong>
				</div>

				${
				    manager?.["Death Date"]
				        ? `
				            <div class="info-item">
				                <span>Death Date</span>
				                <strong>
				                    ${manager["Death Date"]}
				                </strong>
				            </div>
				          `
				        : ""
				}

				<div class="info-item">
				    <span>Nationality</span>
				    <strong>
				        ${nationalityHtml}
				    </strong>
				</div>

                <div class="info-item">
                    <span>Matches</span>
                    <strong>
                        ${managerMatches.length}
                    </strong>
                </div>

                <div class="info-item">
                    <span>Seasons</span>
                    <strong>
                        ${seasons.size}
                    </strong>
                </div>

                <div class="info-item">
                    <span>First Match</span>
                    <strong>
                        ${
                            firstMatch
                            ? `
                                <a href="match.html?id=${firstMatch.ID}">
                                    ${firstMatch.Date}
                                    vs ${firstMatch["Opp. Team"]}
                                    (${firstMatch.Result})
                                </a>
                            `
                            : "-"
                        }
                    </strong>
                </div>

                <div class="info-item">
                    <span>Last Match</span>
                    <strong>
                        ${
                            lastMatch
                            ? `
                                <a href="match.html?id=${lastMatch.ID}">
                                    ${lastMatch.Date}
                                    vs ${lastMatch["Opp. Team"]}
                                    (${lastMatch.Result})
                                </a>
                            `
                            : "-"
                        }
                    </strong>
                </div>

                <div class="info-item">
                    <span>Latest Season</span>
                    <strong>
                        ${
                            managerMatches.length
                            ? managerMatches[
                                managerMatches.length - 1
                              ].Season
                            : "-"
                        }
                    </strong>
                </div>

            </div>

        </div>

    `;
}

function renderManagerMatches(){

    const matches = allMatches
        .filter(match => {

            if(match.Manager !== managerName){
                return false;
            }

            if(
                selectedSeason !== "all" &&
                match.Season !== selectedSeason
            ){
                return false;
            }

            if(
                selectedCompetition !== "all" &&
                match.Competition !== selectedCompetition
            ){
                return false;
            }

            return true;

        })
        .sort((a,b) => {

            const da =
                new Date(
                    a.Date.split(".").reverse().join("-")
                );

            const db =
                new Date(
                    b.Date.split(".").reverse().join("-")
                );

            return db - da;

        });

    document.getElementById(
        "matchesSection"
    ).innerHTML = `

        <div class="matches-list">

            <div class="matches-header">

                <div></div>
                <div>Date</div>
                <div>Venue</div>
                <div>Opponent</div>
                <div>Result</div>

                <div>GF</div>
                <div>GA</div>
                <div>GD</div>
                <div>PTS</div>

            </div>

            ${matches.map(match => {

                const gd =
                    Number(match.Scored || 0) -
                    Number(match.Conceded || 0);

                const pts =
                    match["Result type"] === "W"
                        ? 3
                        : match["Result type"] === "D"
                        ? 1
                        : 0;

                return `

                    <div
                        class="manager-match"
                        onclick="
                            location.href='match.html?id=${match.ID}'
                        ">

                        <div class="competition-cell">

                            ${
                                competitionLogos[
                                    match.Competition
                                ]
                                    ? `
                                        <img
                                            src="logos/${competitionLogos[match.Competition]}"
                                            class="competition-logo">
                                      `
                                    : ""
                            }

                        </div>

                        <div>
                            ${match.Date}
                        </div>

                        <div>
                            ${match["Home/Away"]}
                        </div>

                        <div class="opponent-cell">

                            <img
                                src="logos/clubs/${getClubLogo(match["Opp. Team"])}"
                                class="opponent-logo"
                                onerror="this.src='logos/clubs/default.png'">

                            ${match["Opp. Team"]}

                        </div>

                        <div>

                            <span class="result-badge ${
                                match["Result type"] === "W"
                                    ? "result-win"
                                    : match["Result type"] === "D"
                                    ? "result-draw"
                                    : "result-loss"
                            }">

                                ${match.Result}

                            </span>

                        </div>

                        <div>${match.Scored}</div>

                        <div>${match.Conceded}</div>

                        <div>${gd}</div>

                        <div>${pts}</div>

                    </div>

                `;

            }).join("")}

        </div>

    `;
}

function initFilters(){

    document
    .getElementById("seasonFilter")
    ?.addEventListener("change", e => {

        selectedSeason = e.target.value;

        selectedCompetition = "all";

		renderManager(
		    managerName
		);
		
		populateCompetitionFilter(
		    managerName
		);

        renderActiveSection();

    });

}

function populateCareerCompetitionFilter(managerName){

    const competitions = new Set();

    allMatches.forEach(match => {

        if(match.Manager === managerName){

            competitions.add(
                match.Competition
            );

        }

    });

    document.getElementById(
        "competitionContainer"
    ).innerHTML = `

        <button
            class="competition-btn ${
                selectedCareerCompetition === "all"
                    ? "active"
                    : ""
            }"
            data-career-comp="all">
            All
        </button>

        ${[...competitions]
            .sort()
            .map(comp => `
                <button
                    class="competition-btn ${
                        selectedCareerCompetition === comp
                            ? "active"
                            : ""
                    }"
                    data-career-comp="${comp}">
                    ${getCompetitionShortName(comp)}
                </button>
            `)
            .join("")}
    `;

    attachCareerCompetitionEvents();

}

function attachCareerCompetitionEvents(){

    document
        .querySelectorAll("[data-career-comp]")
        .forEach(btn => {

            btn.addEventListener("click", () => {

                document
                    .querySelectorAll("[data-career-comp]")
                    .forEach(b => b.classList.remove("active"));

                btn.classList.add("active");

                selectedCareerCompetition =
                    btn.dataset.careerComp;

                renderCareerOverview();

            });

        });

}

function populateSeasonFilter(managerName){

    const seasons = new Set();

    allMatches.forEach(match => {

        if(match.Manager === managerName){
            seasons.add(match.Season);
        }

    });

    const seasonFilter =
        document.getElementById(
            "seasonFilter"
        );

    seasonFilter.innerHTML =

        [...seasons]
            .sort()
            .reverse()
            .map(season => `
                <option value="${season}">
                    ${season}
                </option>
            `)
            .join("");

    const latestSeason =
        [...seasons]
            .sort()
            .reverse()[0];

    if(latestSeason){

        seasonFilter.value =
            latestSeason;

        selectedSeason =
            latestSeason;

    }

}

Promise.all([
    fetch("/data/managers.json").then(r => r.json()),
    fetch("/data/data.json").then(r => r.json())
])
.then(([managers, matches]) => {

    allManagers = managers;
    allMatches = matches;

	const managerExists =
	    allMatches.some(
	        match => match.Manager === managerName
	    );
	
	if(!managerExists){
	
	    document.getElementById("managerProfile")
	        .innerHTML = "<p>Manager not found.</p>";
	
	    return;
	}
	
	initPersonSearch();
	
	populateSeasonFilter(
	    managerName
	);
	
	document.title =
	    `${managerName} Manager Statistics | Barça Database`;
	
	renderManager(
	    managerName
	);
	
	populateCompetitionFilter(
	    managerName
	);
	
	initFilters();
	
	initSections();
	
	renderActiveSection();

})
.catch(console.error);

function initPersonSearch(){

	if(!allMatches.length){
	    return;
	}

    const searchItems = new Map();

    allMatches.forEach(match => {

        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

        if(match["Opp. Team"]){

            searchItems.set(
                `opponent-${match["Opp. Team"]}`,
                {
                    name: match["Opp. Team"],
                    type: "Opponent"
                }
            );

        }

        for(let i = 1; i <= 11; i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `manager-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `manager-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        for(let i = 1; i <= 12; i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `manager-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `manager-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

    const input =
        document.getElementById(
            "sidebarPersonSearch"
        );

    const results =
        document.getElementById(
            "sidebarSearchResults"
        );

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){

            results.innerHTML = "";

            return;

        }

        const filtered =
            itemList
            .filter(item =>
                item.name
                    .toLowerCase()
                    .includes(value)
            )
            .slice(0,20);

        results.innerHTML = `
            <div class="manager-search-results">

                ${filtered.map(item => {

                    let url = "manager.html?name=" +
                        encodeURIComponent(item.name);

                    if(item.type === "Manager"){

                        url =
                        "manager.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    if(item.type === "Opponent"){

                        url =
                        "opponent.html?name=" +
                        encodeURIComponent(item.name);

                    }

                    return `

                        <a
                            class="manager-search-item"
                            href="${url}">

                            ${item.name}

                            <span class="search-type ${item.type.toLowerCase()}">
                                (${item.type})
                            </span>

                        </a>

                    `;

                }).join("")}

            </div>
        `;

    });

    input.addEventListener("blur", () => {

        setTimeout(() => {

            results.innerHTML = "";

        }, 200);

    });

}

</script>
