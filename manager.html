<body>

        	<img src="logos/barcadb-logo.png" class="header-logo" alt="Barça DB">
		</a>

            <h1>Barça Database</h1>
	    </div>

<div class="desktop-search">

    <input
        type="text"
        id="personSearch"
        placeholder="Search..."
        class="desktop-search-input">

    <div id="personSearchResults"></div>

</div>

    	☰
    </button>

</div>

            type="text"
            id="mobilePersonSearch"
            placeholder="Search..."
            class="mobile-search-input">

    </div>

        <span>Home page</span>
    </a>

    </a>

<div id="managerProfile">
    Loading...
</div>

    <div class="left-panel">
        <div id="managerContent"></div>
    </div>

    <div class="right-panel">
    
        <div class="widget-title">
            Top 10 Under Manager
        </div>
    
        <div class="widget-card">
            <div id="topManagerPlayers">
                Loading...
            </div>
        </div>
    
    </div>

</div>

</div>

<script src="data/clubMap.js"></script>
<script src="data/competitionMap.js"></script>
<script>

function getClubLogo(team){
    return String(team || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        + ".png";
}

const params =
new URLSearchParams(location.search);

const managerName =
params.get("name");

const competitionLogos = {
    "Copa del Rey": "copa.png",
    "Copa de la Liga": "copa-liga.png",
    "Copa de la Coronación": "copa.png",
    "FIFA Club World Cup": "fifa.png",
    "Qualification for La Liga": "laliga.png",
    "La Liga": "laliga.png",
    "Supercopa de España": "supercopa.png",
    "UEFA Champions League": "ucl.png",
    "Cup Winners' Cup": "cwc.png",
    "UEFA Europa League": "europa.png",
    "UEFA Super Cup": "uefa-supercup.png",
    "UEFA Cup": "uefa-cup.png",
    "Inter-Cities Fairs Cup": "inter-cup.png",
    "European Cup": "ec.png"
};

document.title = `${managerName} | Barça Database`;

document.querySelector('meta[name="description"]')
?.setAttribute(
    "content",
    `${managerName} managerial statistics, matches, wins, draws and losses with FC Barcelona.`
);

const canonical = document.querySelector('link[rel="canonical"]');

if (canonical) {
    canonical.href = location.href;
}

let allMatches = [];

let managerSortColumn = "total";
let managerSortDirection = "desc";

function sortManagerPlayers(column){

    if(managerSortColumn === column){

        managerSortDirection =
            managerSortDirection === "asc"
            ? "desc"
            : "asc";

    }else{

        managerSortColumn = column;
        managerSortDirection = "desc";

    }

    renderTopManagerPlayers(managerName, allMatches);

}

window.sortManagerPlayers = sortManagerPlayers;

Promise.all([
    fetch("data/data.json").then(r=>r.json()),
    fetch("data/managers.json").then(r=>r.json())
])
.then(([data, managers])=>{

    allMatches = data;

    renderManager(managerName, data, managers);

    initPersonSearch();

});

function statValue(value){
    return value === 0 ? "-" : value;
}

function renderManager(manager,data,managers){

const managerMatches = data.filter(match =>

    match.Manager === manager ||
    match["Opp. Manager"] === manager

);

const clubs = [];

managerMatches.forEach(match => {

    if(
        match.Manager === manager &&
        !clubs.includes("FC Barcelona")
    ){
        clubs.push("FC Barcelona");
    }

    if(
        match["Opp. Manager"] === manager &&
        !clubs.includes(match["Opp. Team"])
    ){
        clubs.push(match["Opp. Team"]);
    }

});

const clubsText = clubs.map(club =>

    club === "FC Barcelona"
    ? club
    : `<a href="opponent.html?name=${encodeURIComponent(club)}">${club}</a>`

).join(", ");

managerMatches.sort((a,b)=>{

const da =
new Date(a.Date.split(".").reverse().join("-"));

const db =
new Date(b.Date.split(".").reverse().join("-"));

return da-db;

});

const barcaMatches = managerMatches
.filter(match => match.Manager === manager);

barcaMatches.sort((a,b)=>{

    const da =
    new Date(a.Date.split(".").reverse().join("-"));

    const db =
    new Date(b.Date.split(".").reverse().join("-"));

    return da - db;

});


const debut =
barcaMatches.length
? barcaMatches[0]
: null;

const lastMatch =
barcaMatches.length
? barcaMatches[barcaMatches.length - 1]
: null;

const coachedBarcelona =
managerMatches.some(
    match => match.Manager === manager
);

const clubStats = {};

managerMatches.forEach(match=>{

    const club =
        match.Manager === manager
        ? "FC Barcelona"
        : match["Opp. Team"];

    if(!clubStats[club]){

        clubStats[club] = {
            seasons:new Set(),
            matches:0,
            wins:0,
            draws:0,
            losses:0,
            yellowCards:0,
            redCards:0
        };

    }

    clubStats[club].matches++;
    clubStats[club].seasons.add(match.Season);

    let resultType;

    if(match.Manager === manager){

        resultType = match["Result type"];

    }else{

        resultType =
            match["Result type"] === "W" ? "L" :
            match["Result type"] === "L" ? "W" :
            "D";

    }

    if(resultType === "W") clubStats[club].wins++;
    if(resultType === "D") clubStats[club].draws++;
    if(resultType === "L") clubStats[club].losses++;

    for(let i=1;i<=20;i++){
    
        if(match.Manager === manager){
    
            if(match[`Yellow staff name ${i}`] === manager){
                clubStats[club].yellowCards++;
            }
    
            if(match[`Red staff name ${i}`] === manager){
                clubStats[club].redCards++;
            }
    
        }else{
    
            if(match[`Opp. Yellow staff name ${i}`] === manager){
                clubStats[club].yellowCards++;
            }
    
            if(match[`Opp. Red staff name ${i}`] === manager){
                clubStats[club].redCards++;
            }
    
        }
    
    }

});

const managerInfo =
managers.find(m => m.Manager === manager);

let nationality =
managerInfo?.["Nationality 1"] || "";

if(
    managerInfo?.["Nationality 2"] &&
    managerInfo["Nationality 2"] !== nationality
){
    nationality +=
        " / " +
        managerInfo["Nationality 2"];
}

const careerHtml = Object.keys(clubStats)
.sort((a,b)=>{

    if(a === "FC Barcelona") return -1;
    if(b === "FC Barcelona") return 1;

    return a.localeCompare(b);

})
.map(club=>{

    const s = clubStats[club];

    const winRate =
        s.matches
        ? ((s.wins / s.matches) * 100).toFixed(1)
        : 0;

    return `

        <div class="widget-title club-title">
            ${club}
        </div>

        <div class="summary-grid ${club !== 'FC Barcelona' ? 'opponent-career' : ''}">

            <div class="summary-box">
                <b>${s.seasons.size}</b>
                Seasons
            </div>

            <div class="summary-box">
                <b>${s.matches}</b>
                Matches
            </div>

            <div class="summary-box">
                <b>${statValue(s.wins)}</b>
                Wins
            </div>

            <div class="summary-box">
                <b>${statValue(s.draws)}</b>
                Draws
            </div>

            <div class="summary-box">
                <b>${statValue(s.losses)}</b>
                Losses
            </div>

            <div class="summary-box">
                <b>${winRate}%</b>
                Win %
            </div>

            <div class="summary-box">
                <b>${statValue(s.yellowCards)}</b>
                Yellow
            </div>
            
            <div class="summary-box">
                <b>${statValue(s.redCards)}</b>
                Red
            </div>

        </div>

    `;

}).join("");

document.getElementById("managerProfile").innerHTML=`

<div class="manager-card">

    <div class="manager-info">

        <h1>${manager} (Manager)</h1>
        <div class="manager-clubs">
            ${clubsText}
        </div>

        <div class="manager-meta">

        ${managerInfo?.["Full Name"] ? `
        
        <div>
        <b>Full Name:</b>
        ${managerInfo["Full Name"]}
        </div>
        
        ` : ""}
        
        ${managerInfo?.["Date of Birth"] ? `
        
        <div>
        <b>Born:</b>
        ${managerInfo["Date of Birth"]}
        (${calculateAge(
            managerInfo["Date of Birth"],
            managerInfo["Death Date"]
        )})
        </div>
        
        ` : ""}
        
        ${managerInfo?.["Death Date"] ? `
        
        <div>
        <b>Died:</b>
        ${managerInfo["Death Date"]}
        </div>
        
        ` : ""}
        
        ${nationality ? `
        
        <div>

function buildSeasonMatches(manager, season, data){

    const matches = data.filter(match => {

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        return isManager && match.Season === season;

    });

        let html = `
            <div class="matches-list">
        
            <div class="matches-header">
            
                <div></div>
                <div>Date</div>
                <div>Venue</div>
                <div>Opponent</div>
                <div>Result</div>
                <div>YC</div>
                <div>RC</div>
            
            </div>
        `;

    matches.forEach(match => {
    
        let resultClass = "result-draw";
    
        let resultType;
    
        if(match.Manager === manager){
    
            resultType = match["Result type"];
    
        }else{
    
            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";
        }
    
        if(resultType === "W") resultClass = "result-win";
        if(resultType === "L") resultClass = "result-loss";
            let yellowCards = 0;
            let redCards = 0;
            
            for(let i=1;i<=20;i++){
            
                if(match.Manager === manager){
            
                    if(match[`Yellow staff name ${i}`] === manager){
                        yellowCards++;
                    }
            
                    if(match[`Red staff name ${i}`] === manager){
                        redCards++;
                    }
            
                }else{
            
                    if(match[`Opp. Yellow staff name ${i}`] === manager){
                        yellowCards++;
                    }
            
                    if(match[`Opp. Red staff name ${i}`] === manager){
                        redCards++;
                    }
            
                }
            
            }
    
html += `

<div
    class="match-link-wrapper"
    onclick="location.href='match.html?id=${match.ID}'"
    style="cursor:pointer;"
>

    <div class="manager-match">

        <div class="competition-cell">
            <img
            src="logos/${competitionLogos[match.Competition] || 'default.png'}"
            class="competition-logo"
            alt="${match.Competition}"

        </div>
        
        <div>

        </div>
        
        <div>

		<div class="opponent-cell">
		
		    <img

		        alt="${match["Opp. Team"]}"
		        onerror="this.src='logos/clubs/default.png'">

		       class="opponent-link"
		       onclick="event.stopPropagation();">

		    </a>
		
		</div>
        
        <div>

        <div>

    });
    
    html += `

    `;

    return html;
}

function calculateAge(birthDate, deathDate=""){

if(!birthDate) return "";

const [d,m,y] = birthDate.split(".");
const birth = new Date(y,m-1,d);

let end;

if(deathDate){
const [dd,mm,yy] = deathDate.split(".");
end = new Date(yy,mm-1,dd);
}else{
end = new Date();
}

let age =
end.getFullYear() - birth.getFullYear();

const monthDiff =
end.getMonth() - birth.getMonth();

if(
monthDiff < 0 ||
(monthDiff === 0 && end.getDate() < birth.getDate())
){
age--;
}

return age;
}

function renderManagerStats(manager,data){

    const stats = {};

    data.forEach(match=>{

        const isManager =
            match.Manager === manager ||
            match["Opp. Manager"] === manager;

        if(!isManager){
            return;
        }

        const season = match.Season;

        if(!stats[season]){

        stats[season] = {
            matches:0,
            wins:0,
            draws:0,
            losses:0,
            opponentClub:false
        };

        }

        stats[season].matches++;

        if(match["Opp. Manager"] === manager){
            stats[season].opponentClub = true;
        }

        let resultType;

        if(match.Manager === manager){

            resultType = match["Result type"];

        }else{

            resultType =
                match["Result type"] === "W" ? "L" :
                match["Result type"] === "L" ? "W" :
                "D";

        }

        if(resultType==="W") stats[season].wins++;
        if(resultType==="D") stats[season].draws++;
        if(resultType==="L") stats[season].losses++;

    });

    let html="";

    Object.keys(stats)
    .sort()
    .reverse()
    .forEach(season=>{

        const s = stats[season];

        const winPct =
        s.matches
        ? ((s.wins/s.matches)*100).toFixed(1)
        : 0;

    html += `
    <tr
        class="season-row ${stats[season].opponentClub ? 'opponent-season' : ''}"
        onclick="toggleSeason('season-${season.replace(/\//g,'-')}')"
        style="cursor:pointer">
    
        <td><strong>${season}</strong></td>
    
        <td>${s.matches}</td>
    
        <td>${statValue(s.wins)}</td>
        <td>${statValue(s.draws)}</td>
        <td>${statValue(s.losses)}</td>
    
        <td>${winPct}%</td>
    
    </tr>
    
    <tr
        id="season-${season.replace(/\//g,'-')}"
        style="display:none;">
    
        <td colspan="6">
        
            ${buildSeasonMatches(manager, season, data)}
        
        </td>
    
    </tr>
    `;

});

document.getElementById("seasonRows").innerHTML =
html;

}

function renderTopManagerPlayers(manager,data){

    const stats = {};

    function addPlayer(name){

        if(!name) return;

        if(!stats[name]){

            stats[name] = {
                matches:0,
                goals:0,
                assists:0
            };

        }

    }

    const managerMatches =
        data.filter(match =>
            match.Manager === manager
        );

    managerMatches.forEach(match => {

        for(let i=1;i<=11;i++){

            const player =
                match[`Player name ${i}`];

            if(player){

                addPlayer(player);
                stats[player].matches++;

            }

        }

        for(let i=1;i<=12;i++){

            const player =
                match[`Substitution IN Player ${i}`];

            if(player){

                addPlayer(player);
                stats[player].matches++;

            }

        }

        for(let i=1;i<=12;i++){

            const player =
                match[`Goal Player ${i}`];

            if(player && !player.includes("(OG)")){

                addPlayer(player);
                stats[player].goals++;

            }

        }

        for(let i=1;i<=12;i++){

            const player =
                match[`Assist Player ${i}`];

            if(player){

                addPlayer(player);
                stats[player].assists++;

            }

        }

    });

    const top = Object.entries(stats)

    .map(([name,s]) => ({

        name,
        matches:s.matches,
        goals:s.goals,
        assists:s.assists,
        total:s.goals + s.assists

    }))

    .sort((a,b) => {

        const valueA = a[managerSortColumn];
        const valueB = b[managerSortColumn];

        return managerSortDirection === "asc"
            ? valueA - valueB
            : valueB - valueA;

    })

    .slice(0,10);

    let html = `

    <table class="flick-table">

        <thead>

            <tr>

                <th>Player</th>

                <th
                    class="${managerSortColumn==='matches' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('matches')">
                    M
                </th>

                <th
                    class="${managerSortColumn==='goals' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('goals')">
                    G
                </th>

                <th
                    class="${managerSortColumn==='assists' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('assists')">
                    A
                </th>

                <th
                    class="${managerSortColumn==='total' ? 'flick-selected' : ''}"
                    onclick="sortManagerPlayers('total')">
                    G+A
                </th>

            </tr>

        </thead>

        <tbody>
    `;

    top.forEach(player => {

        html += `

        <tr>

            <td>
                <a
                    class="player-link"
                    href="player.html?name=${encodeURIComponent(player.name)}">
                    ${player.name}
                </a>
            </td>

            <td class="${managerSortColumn==='matches' ? 'flick-column-selected' : ''}">
                ${player.matches}
            </td>

            <td class="${managerSortColumn==='goals' ? 'flick-column-selected' : ''}">
                ${player.goals || "-"}
            </td>

            <td class="${managerSortColumn==='assists' ? 'flick-column-selected' : ''}">
                ${player.assists || "-"}
            </td>

            <td class="${managerSortColumn==='total' ? 'flick-column-selected' : ''}">
                ${player.total || "-"}
            </td>

        </tr>

        `;

    });

    html += `
        </tbody>
    </table>
    `;

    document.getElementById(
        "topManagerPlayers"
    ).innerHTML = html;

}

function initPersonSearch(){

    const searchItems = new Map();

    allMatches.forEach(match => {

        // Barcelona manager
        if(match.Manager){

            searchItems.set(
                `manager-${match.Manager}`,
                {
                    name: match.Manager,
                    type: "Manager"
                }
            );

        }

        // Opponent manager
        if(match["Opp. Manager"]){

            searchItems.set(
                `manager-${match["Opp. Manager"]}`,
                {
                    name: match["Opp. Manager"],
                    type: "Manager"
                }
            );

        }

		// Opponent team
		if(match["Opp. Team"]){
		
		    searchItems.set(
		        `opponent-${match["Opp. Team"]}`,
		        {
		            name: match["Opp. Team"],
		            type: "Opponent"
		        }
		    );
		
		}

        // Starting XI
        for(let i=1;i<=11;i++){

            if(match[`Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Player name ${i}`]}`,
                    {
                        name: match[`Player name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. Player name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. Player name ${i}`]}`,
                    {
                        name: match[`Opp. Player name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

        // Bench
        for(let i=1;i<=12;i++){

            if(match[`On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`On the bench name ${i}`]}`,
                    {
                        name: match[`On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

            if(match[`Opp. On the bench name ${i}`]){

                searchItems.set(
                    `player-${match[`Opp. On the bench name ${i}`]}`,
                    {
                        name: match[`Opp. On the bench name ${i}`],
                        type: "Player"
                    }
                );

            }

        }

    });

    const itemList =
        [...searchItems.values()]
        .sort((a,b) => a.name.localeCompare(b.name));

    function attachSearch(inputId, resultsId){

    const input = document.getElementById(inputId);
    const results = document.getElementById(resultsId);

    if(!input || !results) return;

    input.addEventListener("input", () => {

        const value =
            input.value
            .trim()
            .toLowerCase();

        if(!value){
            results.innerHTML = "";
            return;
        }

		const filtered =
		    itemList
		    .filter(item =>
		        item.name.toLowerCase().includes(value)
		    )
		    .sort((a,b)=>{
		
		        const aStarts =
		            a.name.toLowerCase().startsWith(value);
		
		        const bStarts =
		            b.name.toLowerCase().startsWith(value);
		
		        return Number(bStarts) - Number(aStarts);
		
		    })
		    .slice(0,20);

        results.innerHTML = `
            <div class="player-search-results">
                ${filtered.map(item => {

                    let url = "";

                    if(item.type === "Manager"){
                        url = "manager.html?name=" + encodeURIComponent(item.name);
                    }else if(item.type === "Opponent"){
                        url = "opponent.html?name=" + encodeURIComponent(item.name);
                    }else{
                        url = "player.html?name=" + encodeURIComponent(item.name);
                    }

                    return `
                  
    <a 
        class="player-search-item"
        href="${url}">

        ${item.name}

        <span class="search-type ${item.type.toLowerCase()}">
            (${item.type})
        </span>

    </a>
                    `;
                }).join("")}
            </div>
        `;
    });

    input.addEventListener("blur", () => {
        setTimeout(() => {
            results.innerHTML = "";
        }, 200);
    });

}
attachSearch(
    "personSearch",
    "personSearchResults"
);

attachSearch(
    "mobilePersonSearch",
    "mobileSearchResults"
);

}

document.addEventListener("DOMContentLoaded", () => {

    const menuToggle = document.getElementById("menuToggle");
    const menuOverlay = document.getElementById("menuOverlay");
    const mainMenu = document.querySelector(".main-menu");

    if(!menuToggle || !menuOverlay || !mainMenu){
        return;
    }

    function closeMenu(){
        mainMenu.classList.remove("open");
        menuOverlay.classList.remove("show");
        menuToggle.textContent = "☰";
    }

    function openMenu(){
        mainMenu.classList.add("open");
        menuOverlay.classList.add("show");
        menuToggle.textContent = "✕";
    }

    menuToggle.addEventListener("click", () => {

        if(mainMenu.classList.contains("open")){
            closeMenu();
        }else{
            openMenu();
        }

    });

    menuOverlay.addEventListener("click", closeMenu);

    window.addEventListener("resize", () => {

        if(window.innerWidth > 820){
            closeMenu();
        }

    });

});
